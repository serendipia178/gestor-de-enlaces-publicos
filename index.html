<style id="carbonos-css">

<!DOCTYPE html>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{--bg:#eef2f7;--fg:#14233a;--ac:#1f5fae;--bd:#c9d3e0;--pn:#e1e8f1;font:15px sans-serif;background:var(--bg);color:var(--fg)}
body.dk{--bg:#0d1626;--fg:#e2e8f2;--ac:#6ea8ff;--bd:#25324a;--pn:#142036}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:6px;padding:6px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
button{background:transparent;border:1px solid var(--bd);color:var(--fg);border-radius:6px;min-width:38px;height:38px;font-size:15px;padding:0 8px;flex:none}
button:active{background:var(--ac);color:#fff}
#ti{flex:1;min-width:0;height:38px;border:0;background:transparent;color:var(--fg);font:bold 18px Georgia,serif;outline:0}
#tb{display:flex;gap:4px;padding:5px 6px;overflow-x:auto;border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
#tb button{height:32px;min-width:34px;font-size:14px}
#tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#fr{display:none;gap:4px;flex-wrap:wrap;padding:6px;background:var(--pn);border-bottom:1px solid var(--bd)}
#fr.on{display:flex}
#fr input{flex:1;min-width:42%;height:34px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:0 8px}
#fr button{height:34px;font-size:13px}
#ta{flex:1;width:100%;border:0;padding:14px;resize:none;background:var(--bg);color:var(--fg);outline:0;line-height:1.65}
#st{padding:5px 10px;font-size:12px;background:var(--pn);border-top:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dr,#mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,.55);display:none;z-index:5}
#dr.on{display:block}
#mo.on{display:flex;align-items:center;justify-content:center}
#dp{width:84%;max-width:330px;height:100%;background:var(--bg);display:flex;flex-direction:column}
#sq{margin:8px;height:38px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);border-radius:6px;padding:0 10px}
#nc{padding:0 12px 6px;font-size:12px;opacity:.65}
#ls{overflow:auto;flex:1}
.it{padding:10px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center}
.it.a{background:var(--pn);border-left:4px solid var(--ac)}
.it div{flex:1;min-width:0}
.it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{opacity:.7;font-size:12px}
#mb{width:86%;max-width:360px;max-height:84%;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#mb h3{margin:0 0 8px;font:bold 17px Georgia,serif}
#mb button{display:block;width:100%;text-align:left;margin-bottom:6px;height:42px}
#to{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;display:none;z-index:9;max-width:90%;transition:bottom .15s}

/* Splash de bienvenida */
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,var(--pn),var(--bg));
  transition:opacity .28s ease;opacity:1}
#splash.off{opacity:0;pointer-events:none}
.sl-card{text-align:center;padding:24px;max-width:90vw}
.sl-logo{font:bold 54px Georgia,serif;letter-spacing:2px;color:var(--fg);margin-bottom:6px;
  text-shadow:0 2px 10px rgba(0,0,0,.10)}
.sl-sub{font:italic 14px Georgia,serif;opacity:.65;margin-bottom:38px}
#sl-go{display:block;width:270px;max-width:82vw;height:54px;margin:0 auto 12px;
  border:0;border-radius:27px;background:var(--ac);color:#fff;font:bold 16px sans-serif;
  box-shadow:0 6px 18px rgba(31,95,174,.35);transition:transform .12s ease}
#sl-go:active{transform:scale(.97)}
#sl-alt{display:block;width:270px;max-width:82vw;height:42px;margin:0 auto 24px;
  border:1px solid var(--bd);border-radius:21px;background:transparent;color:var(--fg);
  font:14px sans-serif}
#sl-alt:active{background:var(--pn)}
.sl-check{display:inline-flex;align-items:center;gap:8px;font-size:13px;opacity:.75;cursor:pointer;user-select:none}
.sl-check input{width:16px;height:16px;accent-color:var(--ac);margin:0}
</style>
<style>body,button,input,select{font-family:'Segoe UI',Tahoma,Arial,sans-serif}button{border-radius:4px!important;box-shadow:inset 0 1px #ffffff80;background-image:linear-gradient(#ffffff33,#ffffff11 48%,#00233f11 49%,#ffffff22)}input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{border-radius:3px!important}header{background-image:linear-gradient(#d6efff55,#5796bd22)}</style><style id="escriba-tablet-v1">html,body{height:100%;overflow:hidden}#app{height:100%;min-height:0;min-width:0;overflow:hidden}header,#tb,#fr,#st{flex-shrink:0}header{padding:8px;gap:8px}header button{min-width:44px;height:44px}#ti{height:44px;font-size:18px;padding:0 4px}#tb{gap:6px;padding:7px 8px;scrollbar-width:thin;touch-action:pan-x}#tb button{height:44px;min-width:44px;padding:0 10px;font-size:15px}#ta{min-height:0;flex:1 1 0;overflow:auto;padding:18px;line-height:1.7;user-select:text!important;-webkit-user-select:text!important;touch-action:pan-y;scroll-padding-bottom:24px}#st{display:flex;gap:10px;justify-content:space-between;align-items:center;min-height:32px;padding:6px 12px;white-space:normal;font-size:12px;line-height:1.4}#counts{min-width:0}#save-indicator{flex-shrink:0;font-weight:600}#st[data-save=error] #save-indicator{text-decoration:underline}#fr input{height:44px;font-size:16px}#fr button{height:44px}.it{padding:12px;min-height:64px}.it button{min-width:44px;height:44px}#sq{height:44px;font-size:16px}#mb{max-height:88%;max-height:88dvh}#mb button{height:auto;min-height:46px;padding:9px 12px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}#to{pointer-events:none}@media(min-width:700px){#ta{padding:24px max(24px,calc((100% - 76ch)/2))}#dp{max-width:390px}#mb{max-width:440px}header{padding:10px 14px}#tb{padding-left:14px;padding-right:14px}}@media(max-height:460px){header{padding:3px 6px;gap:6px}#tb{padding:3px 6px}#ta{padding-top:10px;padding-bottom:10px}#st{min-height:26px;padding-top:3px;padding-bottom:3px}}@media(max-width:420px){header{gap:4px;padding:6px}#ti{font-size:16px}#st{font-size:11px;gap:6px}#counts{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}</style></head>

'use strict';
const LS_THEME='grafia_theme_v1';
const LS_DRAFT='grafia_draft_v1';
const LS_FONT='grafia_font_v1';
const LS_AUTO='grafia_autocopy_v1';
const $=i=>document.getElementById(i);

/* ============ DEFINICIÓN DE LAS 16 FUENTES ============ */
const AMBIGUOS='';
const MAPS={
  minAltas:{
    a:'ᴀ',b:'ʙ',c:'ᴄ',d:'ᴅ',e:'ᴇ',f:'ꜰ',g:'ɢ',h:'ʜ',i:'ɪ',j:'ᴊ',
    k:'ᴋ',l:'ʟ',m:'ᴍ',n:'ɴ',o:'ᴏ',p:'ᴘ',q:'ǫ',r:'ʀ',s:'ꜱ',t:'ᴛ',
    u:'ᴜ',v:'ᴠ',w:'ᴡ',x:'x',y:'ʏ',z:'ᴢ',
    A:'ᴀ',B:'ʙ',C:'ᴄ',D:'ᴅ',E:'ᴇ',F:'ꜰ',G:'ɢ',H:'ʜ',I:'ɪ',J:'ᴊ',
    K:'ᴋ',L:'ʟ',M:'ᴍ',N:'ɴ',O:'ᴏ',P:'ᴘ',Q:'ǫ',R:'ʀ',S:'ꜱ',T:'ᴛ',
    U:'ᴜ',V:'ᴠ',W:'ᴡ',X:'x',Y:'ʏ',Z:'ᴢ'
  },
  circulos:{},
  cuadrados:{},
  circNegros:{}
};
(function(){
  const aL='abcdefghijklmnopqrstuvwxyz';
  const aU='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let i=0;i<26;i++){
    MAPS.circulos[aL[i]]=String.fromCodePoint(0x24D0+i);
    MAPS.circulos[aU[i]]=String.fromCodePoint(0x24B6+i);
    MAPS.cuadrados[aU[i]]=String.fromCodePoint(0x1F130+i);
    MAPS.circNegros[aU[i]]=String.fromCodePoint(0x1F150+i);
  }
  for(let i=0;i<10;i++){
    MAPS.circulos[String(i)]=String.fromCodePoint(0x2460+i-1+1);
  }
  MAPS.circulos['0']='⓪';
})();

const FUENTES=[
  {id:'negrita',cat:'serif',nombre:'Negrita',muestra:'𝐀𝐚',tipo:'rango',up:0x1D400,lo:0x1D41A,num:0x1D7CE},
  {id:'cursiva',cat:'serif',nombre:'Cursiva',muestra:'𝐴𝑎',tipo:'rango',up:0x1D434,lo:0x1D44E,num:null,upex:{h:0x210E}},
  {id:'negcursiva',cat:'serif',nombre:'Negrita cursiva',muestra:'𝑨𝒂',tipo:'rango',up:0x1D468,lo:0x1D482,num:null},
  {id:'caligrafica',cat:'serif',nombre:'Caligráfica',muestra:'𝒜𝒶',tipo:'rango',up:0x1D49C,lo:0x1D4B6,num:null,
    upex:{B:0x212C,E:0x2130,F:0x2131,H:0x210B,I:0x2110,L:0x2112,M:0x2133,R:0x211B},
    loex:{e:0x212F,g:0x210A,o:0x2134}},
  {id:'gotica',cat:'serif',nombre:'Gótica',muestra:'𝔄𝔞',tipo:'rango',up:0x1D504,lo:0x1D51E,num:null,
    upex:{C:0x212D,H:0x210C,I:0x2111,R:0x211C,Z:0x2128}},
  {id:'dobletrazo',cat:'serif',nombre:'Doble trazo',muestra:'𝔸𝕒',tipo:'rango',up:0x1D538,lo:0x1D552,num:0x1D7D8,
    upex:{C:0x2102,H:0x210D,N:0x2115,P:0x2119,Q:0x211A,R:0x211D,Z:0x2124}},

  {id:'sans',cat:'sans',nombre:'Sans',muestra:'𝖠𝖺',tipo:'rango',up:0x1D5A0,lo:0x1D5BA,num:0x1D7E2},
  {id:'sansnegrita',cat:'sans',nombre:'Sans negrita',muestra:'𝗔𝗮',tipo:'rango',up:0x1D5D4,lo:0x1D5EE,num:0x1D7EC},
  {id:'sanscursiva',cat:'sans',nombre:'Sans cursiva',muestra:'𝘈𝘢',tipo:'rango',up:0x1D608,lo:0x1D622,num:null},
  {id:'sansnegcursiva',cat:'sans',nombre:'Sans neg. cursiva',muestra:'𝘼𝙖',tipo:'rango',up:0x1D63C,lo:0x1D656,num:null},
  {id:'mono',cat:'sans',nombre:'Monoespaciado',muestra:'𝙰𝚊',tipo:'rango',up:0x1D670,lo:0x1D68A,num:0x1D7F6},

  {id:'ancho',cat:'deco',nombre:'Ancho',muestra:'Ａａ',tipo:'rango',up:0xFF21,lo:0xFF41,num:0xFF10},
  {id:'minaltas',cat:'deco',nombre:'Minúsc. altas',muestra:'ᴀʙᴄ',tipo:'mapa',mapa:'minAltas'},
  {id:'circulos',cat:'deco',nombre:'Círculos',muestra:'Ⓐⓐ',tipo:'mapa',mapa:'circulos'},
  {id:'cuadrados',cat:'deco',nombre:'Cuadrados*',muestra:'🄰🄱',tipo:'mapa',mapa:'cuadrados'},
  {id:'circnegros',cat:'deco',nombre:'Círculos negros*',muestra:'🅐🅑',tipo:'mapa',mapa:'circNegros'}
];

/* ============ CONVERSIÓN ============ */
function aplicarRango(texto,f){
  const out=[];
  for(const ch of texto){
    const cp=ch.codePointAt(0);
    if(cp>=0x41&&cp<=0x5A){
      if(f.upex&&f.upex[ch]){out.push(String.fromCodePoint(f.upex[ch]));}
      else if(f.up){out.push(String.fromCodePoint(f.up+(cp-0x41)));}
      else out.push(ch);
    }else if(cp>=0x61&&cp<=0x7A){
      if(f.loex&&f.loex[ch]){out.push(String.fromCodePoint(f.loex[ch]));}
      else if(f.lo){out.push(String.fromCodePoint(f.lo+(cp-0x61)));}
      else out.push(ch);
    }else if(cp>=0x30&&cp<=0x39){
      if(f.num){out.push(String.fromCodePoint(f.num+(cp-0x30)));}
      else out.push(ch);
    }else{
      out.push(ch);
    }
  }
  return out.join('');
}
function aplicarMapa(texto,mapa){
  const out=[];
  for(const ch of texto){out.push(mapa[ch]!==undefined?mapa[ch]:ch);}
  return out.join('');
}
function convertir(texto,fuenteId){
  const f=FUENTES.find(x=>x.id===fuenteId);
  if(!f||!texto)return texto;
  if(f.tipo==='mapa')return aplicarMapa(texto,MAPS[f.mapa]);
  return aplicarRango(texto,f);
}

/* ============ ESTADO ============ */
let fuenteActual='negrita';
let autocopy=false;

/* ============ TEMA ============ */
function th(t){
  document.documentElement.setAttribute('data-theme',t);
  $('ibt').textContent=t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#050B24':'#f5f6fa');
  try{localStorage.setItem(LS_THEME,t);}catch(e){}
}

/* ============ TOAST ============ */
let TT;
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(TT);TT=setTimeout(()=>e.classList.remove('sh'),2200);}

/* ============ RENDERIZADO DE BOTONES ============ */
function pintarFuentes(){
  const grupos={serif:$('gSerif'),sans:$('gSans'),deco:$('gDeco')};
  Object.values(grupos).forEach(g=>g.innerHTML='');
  FUENTES.forEach(f=>{
    const b=document.createElement('button');
    b.className='fbtn'+(f.id===fuenteActual?' act':'');
    b.dataset.id=f.id;
    b.innerHTML='<div class="fbtn-sample">'+f.muestra+'</div><div class="fbtn-nombre">'+f.nombre+'</div>';
    b.onclick=()=>{
      fuenteActual=f.id;
      try{localStorage.setItem(LS_FONT,f.id);}catch(e){}
      $('fActual').textContent=f.nombre;
      document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('act',x.dataset.id===f.id));
      render();
      if(autocopy)copiar(true);
      if(navigator.vibrate)navigator.vibrate(8);
    };
    grupos[f.cat].appendChild(b);
  });
}

/* ============ RENDER ============ */
function render(){
  const txt=$('inp').value;
  const res=convertir(txt,fuenteActual);
  $('out').value=res;
  $('inpCount').textContent=txt.length+' car.';
  $('outCount').textContent=res.length+' car.';
  try{localStorage.setItem(LS_DRAFT,txt);}catch(e){}
}

/* ============ ACCIONES ============ */
async function pegar(){
  try{
    const t=await navigator.clipboard.readText();
    if(!t){toast('Portapapeles vacío');return;}
    $('inp').value=t;
    render();
    toast('✓ Pegado');
  }catch(e){
    $('inp').focus();
    toast('Pega manualmente con long-press → Pegar');
  }
}
function limpiar(){
  if(!$('inp').value&&!$('out').value){toast('Ya está vacío');return;}
  if(!confirm('¿Borrar ambos textos?'))return;
  $('inp').value='';$('out').value='';
  $('inpCount').textContent='0 car.';
  $('outCount').textContent='0 car.';
  try{localStorage.removeItem(LS_DRAFT);}catch(e){}
  toast('Limpiado');
}
async function copiar(silencioso){
  const t=$('out').value;
  if(!t){if(!silencioso)toast('Nada que copiar');return;}
  try{
    await navigator.clipboard.writeText(t);
    if(!silencioso)toast('✓ Copiado');
    else toast('✓ Copiado automáticamente');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');if(!silencioso)toast('✓ Copiado');}catch(_){toast('No se pudo copiar');}
    document.body.removeChild(ta);
  }
}
function usarComoEntrada(){
  const t=$('out').value;
  if(!t){toast('Nada que usar');return;}
  $('inp').value=t;
  render();
  toast('↺ Texto encadenado');
  $('inp').focus();
}
function toggleAuto(){
  autocopy=!autocopy;
  $('swAuto').classList.toggle('on',autocopy);
  try{localStorage.setItem(LS_AUTO,autocopy?'1':'0');}catch(e){}
  toast(autocopy?'Autocopiado activado':'Autocopiado desactivado');
}

/* ============ INIT ============ */
function init(){
  $('year').textContent=new Date().getFullYear();
  th(localStorage.getItem(LS_THEME)||'light');
  try{
    const f=localStorage.getItem(LS_FONT);
    if(f&&FUENTES.some(x=>x.id===f))fuenteActual=f;
    autocopy=localStorage.getItem(LS_AUTO)==='1';
    const d=localStorage.getItem(LS_DRAFT);
    if(d)$('inp').value=d;
  }catch(e){}
  $('swAuto').classList.toggle('on',autocopy);
  $('fActual').textContent=FUENTES.find(f=>f.id===fuenteActual).nombre;

  pintarFuentes();
  $('ibt').onclick=()=>{const c=document.documentElement.getAttribute('data-theme')||'light';th(c==='dark'?'light':'dark');};
  $('inp').oninput=render;
  $('btnPegar').onclick=pegar;
  $('btnLimpiar').onclick=limpiar;
  $('btnCopiar').onclick=()=>copiar(false);
  $('btnUsar').onclick=usarComoEntrada;
  $('swAuto').onclick=toggleAuto;
  render();
}
document.addEventListener('DOMContentLoaded',init);
<\/script>

function resumeCtx(){var ctx=getCtx();if(!ctx)return null;if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}return ctx;}

function sndDisparo(){
var ctx=resumeCtx();if(!ctx)return;var t=ctx.currentTime;
var o=ctx.createOscillator(),g=ctx.createGain();
o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(300,t+0.14);
o.connect(g);g.connect(ctx.destination);
g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.09,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
o.start(t);o.stop(t+0.18);
}
function sndClic(){
var ctx=resumeCtx();if(!ctx)return;var t=ctx.currentTime;
var o=ctx.createOscillator(),g=ctx.createGain();
o.type='triangle';o.frequency.setValueAtTime(1100,t);o.frequency.exponentialRampToValueAtTime(700,t+0.05);
o.connect(g);g.connect(ctx.destination);
g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.06,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
o.start(t);o.stop(t+0.08);
}
function sndMatch(i){
var ctx=resumeCtx();if(!ctx)return;var t=ctx.currentTime+i*0.05;var base=600+i*70;
var o=ctx.createOscillator(),g=ctx.createGain();

/* ============ CANVAS ============ */
var cv,ctx;

/* ============ PATH ============ */
var path=[];
var pathLen=[0];
var pathTotal=0;

function generarPath(){
path=[];
pathLen=[0];
var cx=W/2;
var cy=H/2;
var maxR=Math.min(W,H)*0.46;
var minR=Math.min(W,H)*0.12;
var vueltas=3.2;
var totalAngulo=vueltas*2*Math.PI;
var pasos=600;
for(var i=0;i<=pasos;i++){
var p=i/pasos;
var ang=p*totalAngulo-Math.PI/2;
var rad=maxR-(maxR-minR)*p;
path.push({x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad});
}
var acc=0;
for(var j=1;j<path.length;j++){
var dx=path[j].x-path[j-1].x;
var dy=path[j].y-path[j-1].y;
acc+=Math.sqrt(dx*dx+dy*dy);
pathLen.push(acc);
}
pathTotal=acc;
}

function posEnPath(t){
if(t<=0)return {x:path[0].x,y:path[0].y};
if(t>=pathTotal)return {x:path[path.length-1].x,y:path[path.length-1].y};
var lo=0,hi=pathLen.length-1;
while(lo<hi-1){
var mid=(lo+hi)>>1;
if(pathLen[mid]<t)lo=mid;else hi=mid;
}
var t0=pathLen[lo],t1=pathLen[hi];
var frac=(t-t0)/(t1-t0);
return {
x:path[lo].x+(path[hi].x-path[lo].x)*frac,
y:path[lo].y+(path[hi].y-path[lo].y)*frac
};
}

function tCercana(x,y){
var bestT=0,bestD=1e12;
for(var i=0;i<path.length;i++){
var dx=x-path[i].x,dy=y-path[i].y;
var d=dx*dx+dy*dy;
if(d<bestD){bestD=d;bestT=pathLen[i];}
}
return bestT;
}

/* ============ LAYOUT ============ */
function layout(){
var oldTotal=pathTotal,oldSpacing=canicaR*2.05,oldTs=cadena.map(function(c){return c.t});
var stage=document.querySelector('.stage');
var rr=stage.getBoundingClientRect();
W=Math.floor(rr.width)||360;

canicaR=Math.max(9,Math.min(15,W*0.032));
canonX=W/2;
canonY=H/2;
generarPath();
if(cadena.length&&oldTotal>0){var last=cadena.length-1;cadena[last].t=oldTs[last]*pathTotal/oldTotal;for(var i=last-1;i>=0;i--)cadena[i].t=cadena[i+1].t-Math.max(espaciado(),(oldTs[i+1]-oldTs[i])*espaciado()/oldSpacing);posicionarCadena()}
}

/* ============ INICIO NIVEL ============ */
function iniciarNivel(){
var n=Math.min(35+nivel*5,75,Math.max(12,Math.floor(pathTotal*.58/espaciado())));retrocesoTotal=0;
cadena=[];
coloresEnNivel=Math.min(3+Math.floor((nivel-1)/3),5);
velocidad=0.30+nivel*0.045;
for(var i=0;i<n;i++){
var color=Math.floor(Math.random()*coloresEnNivel);
cadena.push({color:color,t:i*canicaR*2.05,x:0,y:0});
}
for(var j=0;j<cadena.length;j++){
var p=posEnPath(cadena[j].t);
cadena[j].x=p.x;cadena[j].y=p.y;
}
siguienteColor=Math.floor(Math.random()*coloresEnNivel);
siguienteEsDorada=false;
sigColor=Math.floor(Math.random()*coloresEnNivel);
sigDorada=false;
disparosDesdeDorada=0;
proyectil=null;
particulas=[];
enJuego=true;

}

$('mdWin').classList.remove('act');

}

/* ============ AVANZAR CADENA ============ */
var retrocesoTotal=0;
function espaciado(){return canicaR*2.05}
function posicionarCadena(){for(var i=0;i<cadena.length;i++){var p=posEnPath(cadena[i].t);cadena[i].x=p.x;cadena[i].y=p.y}}
function avanzarCadena(){if(!cadena.length)return;var sep=espaciado(),closed=-1;
 if(retrocesoTotal>0){var back=Math.min(retrocesoTotal,canicaR*.48);cadena.forEach(function(c){c.t-=back});retrocesoTotal-=back}
 else{var gap=-1;for(var i=1;i<cadena.length;i++)if(cadena[i].t-cadena[i-1].t>sep+.15){gap=i;break}
 if(gap>=0){var distance=cadena[gap].t-cadena[gap-1].t-sep,step=Math.min(distance,canicaR*.48);for(var j=gap;j<cadena.length;j++)cadena[j].t-=step;if(distance-step<=.15)closed=gap}
 else cadena.forEach(function(c){c.t+=velocidad})}
 posicionarCadena();if(closed>0&&cadena[closed]&&cadena[closed-1].color===cadena[closed].color)verificarMatch(closed);
 if(cadena.length&&cadena[cadena.length-1].t>=pathTotal-canicaR*1.2)finDelJuego();}
function compactarCadena(){if(!cadena.length)return;var sep=espaciado();for(var i=1;i<cadena.length;i++)if(cadena[i].t<cadena[i-1].t+sep)cadena[i].t=cadena[i-1].t+sep;posicionarCadena()}
function aplicarRetroceso(indiceAnterior,numEliminadas){if(indiceAnterior<0&&cadena.length)retrocesoTotal+=numEliminadas*espaciado()*.65;if(cadena.length)sndRetroceso()}

/* ============ DISPARO ============ */
function disparar(){
if(!enJuego||proyectil)return;
var esDorada=siguienteEsDorada;
var color=siguienteColor;
siguienteColor=sigColor;
siguienteEsDorada=sigDorada;
sigColor=Math.floor(Math.random()*coloresEnNivel);
sigDorada=false;
if(esDorada){disparosDesdeDorada=0;}
else{
disparosDesdeDorada++;
if(disparosDesdeDorada>=disparosParaDorada){sigDorada=true;disparosDesdeDorada=0;}
}
var vx=Math.cos(anguloCanon);
var vy=Math.sin(anguloCanon);
var vel=11;
proyectil={x:canonX,y:canonY,vx:vx*vel,vy:vy*vel,color:color,dorada:esDorada};
sndDisparo();
}

/* ============ COLISIÓN PROYECTIL ============ */
function proyectilColisiona(){
if(!proyectil)return -1;
var lim=(canicaR*2-2);
for(var i=0;i<cadena.length;i++){
var c=cadena[i];if(c.t<0)continue;
var dx=proyectil.x-c.x,dy=proyectil.y-c.y;
if(dx*dx+dy*dy<lim*lim)return i;
}
return -1;
}

/* ============ INSERTAR PROYECTIL ============ */
function insertarProyectil(indice){if(!proyectil||!cadena[indice])return;var p=proyectil,c=cadena[indice],sep=espaciado(),before=posEnPath(c.t-2),after=posEnPath(c.t+2),dot=(p.x-c.x)*(after.x-before.x)+(p.y-c.y)*(after.y-before.y),nuevoIndice=dot>0?indice+1:indice,newT=dot>0?c.t+sep:c.t;cadena.splice(nuevoIndice,0,{color:p.color,t:newT,x:p.x,y:p.y});var dorada=p.dorada;proyectil=null;compactarCadena();sndClic();if(dorada){var desde=Math.max(0,nuevoIndice-2),hasta=Math.min(cadena.length-1,nuevoIndice+2),num=hasta-desde+1;for(var i=desde;i<=hasta;i++)crearParticulas(cadena[i].x,cadena[i].y,cadena[i].color);cadena.splice(desde,num);puntos+=num*8;$('hudPuntos').textContent=puntos;sndDorada();aplicarRetroceso(desde-1,num);posicionarCadena();comprobarVictoria();return}verificarMatch(nuevoIndice)}

/* ============ MATCH ============ */
function verificarMatch(indice){if(!cadena[indice])return;var color=cadena[indice].color,ini=indice,fin=indice,sep=espaciado();while(ini>0&&cadena[ini-1].color===color&&cadena[ini].t-cadena[ini-1].t<=sep+.2)ini--;while(fin<cadena.length-1&&cadena[fin+1].color===color&&cadena[fin+1].t-cadena[fin].t<=sep+.2)fin++;var total=fin-ini+1;if(total<3)return;for(var i=ini;i<=fin;i++){crearParticulas(cadena[i].x,cadena[i].y,cadena[i].color);sndMatch(i-ini)}puntos+=total*10;$('hudPuntos').textContent=puntos;cadena.splice(ini,total);aplicarRetroceso(ini-1,total);posicionarCadena();sndCompactar();comprobarVictoria()}

function comprobarVictoria(){
if(!enJuego)return;
if(cadena.length===0){
nivel++;
$('winPuntos').textContent=puntos;

/* ============ PARTÍCULAS ============ */
function crearParticulas(x,y,color){
var col;
if(color===undefined||color<0)col=DORADA;
else col=PALETA[color];
for(var i=0;i<10;i++){
var ang=Math.random()*Math.PI*2;
var vel=1+Math.random()*4;
particulas.push({
x:x,y:y,
vx:Math.cos(ang)*vel,vy:Math.sin(ang)*vel-0.5,
size:2+Math.random()*3,
color:col.base,
vida:1
});
}
}

/* ============ ACTUALIZAR ============ */
function actualizar(){
if(!enJuego)return;

avanzarCadena();

if(proyectil){
proyectil.x+=proyectil.vx;
proyectil.y+=proyectil.vy;
if(proyectil.x-canicaR<0){proyectil.x=canicaR;proyectil.vx=-proyectil.vx;}
if(proyectil.x+canicaR>W){proyectil.x=W-canicaR;proyectil.vx=-proyectil.vx;}
if(proyectil.y-canicaR<0){proyectil.y=canicaR;proyectil.vy=-proyectil.vy;}
if(proyectil.y+canicaR>H){proyectil.y=H-canicaR;proyectil.vy=-proyectil.vy;}
var idx=proyectilColisiona();
if(idx>=0)insertarProyectil(idx);
}

for(var i=particulas.length-1;i>=0;i--){
var p=particulas[i];
p.vy+=0.25;
p.x+=p.vx;
p.y+=p.vy;
p.vida-=0.025;
if(p.vida<=0)particulas.splice(i,1);
}
}

/* ============ DIBUJO ============ */
function dibujar(){
ctx.clearRect(0,0,W,H);

var g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#e8c88a');
g.addColorStop(0.5,'#c9a76a');
g.addColorStop(1,'#8a6a3a');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);

ctx.globalAlpha=0.06;
ctx.fillStyle='#5a3a10';
for(var i=0;i<12;i++){
var bx=(i*173)%W;
var by=(i*271)%H;
var br=30+((i*67)%60);
ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;

dibujarPath();

for(var k=0;k<particulas.length;k++){
var p2=particulas[k];
ctx.globalAlpha=Math.max(0,p2.vida);
ctx.fillStyle=p2.color;
ctx.beginPath();ctx.arc(p2.x,p2.y,p2.size,0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;

for(var j=0;j<cadena.length;j++){
if(cadena[j].t>=0)dibujarCanica(cadena[j].x,cadena[j].y,canicaR,cadena[j].color);
}

if(proyectil){
if(proyectil.dorada)dibujarDorada(proyectil.x,proyectil.y,canicaR);
else dibujarCanica(proyectil.x,proyectil.y,canicaR,proyectil.color);
}

dibujarEscarabajo();

if(siguienteEsDorada)dibujarDorada(canonX+canicaR*3,canonY+canicaR*2.5,canicaR*0.7);
else dibujarCanica(canonX+canicaR*3,canonY+canicaR*2.5,canicaR*0.7,siguienteColor);
ctx.fillStyle='rgba(30,15,5,.6)';
ctx.font='9px -apple-system,sans-serif';
ctx.textAlign='center';
ctx.fillText('SIGUIENTE',canonX+canicaR*3,canonY+canicaR*3.8);
}

function dibujarPath(){
ctx.strokeStyle='rgba(80,50,15,.55)';
ctx.lineWidth=canicaR*2.2;
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.beginPath();
ctx.moveTo(path[0].x,path[0].y);
for(var i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
ctx.stroke();
ctx.strokeStyle='rgba(255,200,90,.55)';
ctx.lineWidth=canicaR*1.6;
ctx.beginPath();
ctx.moveTo(path[0].x,path[0].y);
for(var j=1;j<path.length;j++)ctx.lineTo(path[j].x,path[j].y);
ctx.stroke();
ctx.strokeStyle='rgba(255,240,180,.4)';
ctx.lineWidth=canicaR*0.5;
ctx.beginPath();
ctx.moveTo(path[0].x,path[0].y);
for(var k=1;k<path.length;k++)ctx.lineTo(path[k].x,path[k].y);
ctx.stroke();

ctx.fillStyle='rgba(30,15,5,.7)';
ctx.beginPath();
ctx.arc(W/2,H/2,canicaR*1.2,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle='rgba(255,200,90,.7)';
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(W/2,H/2,canicaR*1.2,0,Math.PI*2);

}

function dibujarCanica(x,y,rad,colorIdx){

ctx.lineWidth=1.2;ctx.stroke();
ctx.fillStyle='rgba(255,255,255,.6)';

function dibujarDorada(x,y,rad){

ctx.fillStyle='rgba(255,255,255,.95)';

ctx.ellipse(x-rad*0.32,y-rad*0.4,rad*0.36,rad*0.24,-Math.PI/4,0,Math.PI*2);

function dibujarEscarabajo(){

ctx.fillStyle='rgba(0,0,0,.25)';

var g=ctx.createRadialGradient(cx-rad*0.3,cy-rad*0.3,rad*0.2,cx,cy,rad*1.3);

g.addColorStop(1,'#1a0e05');

for(var j=-1;j<=1;j+=2){

}
}

ctx.fillStyle='#2a1808';
ctx.beginPath();ctx.ellipse(cx,cy-rad*0.95,rad*0.55,rad*0.4,0,0,Math.PI*2);ctx.fill();

ctx.fillStyle='rgba(255,200,90,.95)';
ctx.beginPath();ctx.arc(cx-rad*0.25,cy-rad*1.05,rad*0.1,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(cx+rad*0.25,cy-rad*1.05,rad*0.1,0,Math.PI*2);ctx.fill();

ctx.strokeStyle='rgba(255,200,90,.75)';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(cx-rad*0.3,cy-rad*1.2);
ctx.lineTo(cx-rad*0.7,cy-rad*1.6);
ctx.moveTo(cx+rad*0.3,cy-rad*1.2);
ctx.lineTo(cx+rad*0.7,cy-rad*1.6);
ctx.stroke();

ctx.save();
ctx.translate(cx,cy);
ctx.rotate(anguloCanon);
ctx.fillStyle='#3a2510';
ctx.fillRect(rad*0.6,-rad*0.2,rad*0.9,rad*0.4);
ctx.fillStyle='#1a0e05';
ctx.fillRect(rad*1.2,-rad*0.28,rad*0.4,rad*0.56);
ctx.restore();
}

/* ============ INPUT ============ */
function pos(ev){
var rr=cv.getBoundingClientRect();
if(ev.touches && ev.touches[0]) return {x:ev.touches[0].clientX-rr.left,y:ev.touches[0].clientY-rr.top};
if(ev.changedTouches && ev.changedTouches[0]) return {x:ev.changedTouches[0].clientX-rr.left,y:ev.changedTouches[0].clientY-rr.top};
return {x:ev.clientX-rr.left,y:ev.clientY-rr.top};
}

function actualizarAngulo(px,py){
var dx=px-canonX,dy=py-canonY;
anguloCanon=Math.atan2(dy,dx);
}

function empezar(ev){
ev.preventDefault();
if(!enJuego||proyectil)return;
apuntando=true;
resumeCtx();
var p=pos(ev);
actualizarAngulo(p.x,p.y);
}

function mover(ev){
if(!apuntando)return;
ev.preventDefault();
var p=pos(ev);
actualizarAngulo(p.x,p.y);
}

function terminar(ev){
if(!apuntando)return;
ev.preventDefault();
apuntando=false;
disparar();
}

/* ============ BUCLE ============ */
var intervalo=1000/60,luxorRAF=0,luxorSuspended=false,luxorAccumulator=0;
function bucle(ts){luxorRAF=0;if(luxorSuspended||document.hidden){lastTime=0;return}if(!lastTime)lastTime=ts;var dt=Math.min(100,Math.max(0,ts-lastTime));lastTime=ts;luxorAccumulator+=dt;var steps=0;while(luxorAccumulator>=intervalo&&steps<6){actualizar();luxorAccumulator-=intervalo;steps++}dibujar();luxorRAF=requestAnimationFrame(bucle)}
window.carbonVisibility=function(visible){luxorSuspended=!visible;lastTime=0;luxorAccumulator=0;apuntando=false;if(luxorSuspended){cancelAnimationFrame(luxorRAF);luxorRAF=0}else if(!luxorRAF)luxorRAF=requestAnimationFrame(bucle)};
document.addEventListener('visibilitychange',function(){window.carbonVisibility(!document.hidden)});

/* ============ INIT ============ */
function init(){
$('year').textContent=new Date().getFullYear();
th(localStorage.getItem(TK)||'light');

cv=$('cv');
cargarRecord();
layout();
setTimeout(layout,150);
setTimeout(layout,500);

window.addEventListener('resize',function(){layout();});
window.addEventListener('orientationchange',function(){setTimeout(layout,300);});

cv.addEventListener('touchstart',empezar,{passive:false});
cv.addEventListener('touchmove',mover,{passive:false});
cv.addEventListener('touchend',terminar,{passive:false});
cv.addEventListener('touchcancel',function(){apuntando=false},{passive:true});
cv.addEventListener('mousedown',empezar);
cv.addEventListener('mousemove',mover);
cv.addEventListener('mouseup',terminar);
window.addEventListener('mouseup',function(e){if(apuntando)terminar(e);});

$('btnTema').onclick=function(){
var c=document.documentElement.getAttribute('data-theme')||'light';
th(c==='dark'?'light':'dark');
};
$('btnReset').onclick=function(){
if(!confirm('¿Reiniciar la partida?'))return;
nuevaPartida();
};
$('btnReintentar').onclick=nuevaPartida;
$('btnSiguienteNivel').onclick=function(){
$('mdWin').classList.remove('act');
iniciarNivel();
};

document.addEventListener('touchstart',function once(){
resumeCtx();
document.removeEventListener('touchstart',once);
},{once:true});

nuevaPartida();
luxorRAF=requestAnimationFrame(bucle);
}

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',init);
}else{
init();
}

}catch(err){
mostrarError('Error al iniciar: '+(err.message||err));
if(window.console)console.error(err);
}
<\/script>

<\script>
'use strict';
const TK='majong_theme_v1';
const LS_STATS='majong_stats_v1';
const $=i=>document.getElementById(i);

/* ============ SÍMBOLOS ============ */
/* 24 símbolos distintos y muy reconocibles, con buen contraste */
const SYMBOLS = [
  '🌸','🌺','🌻','🌹','🌷','🍀',
  '🍁','⭐','🌙','☀️','⚡','🎵',
  '🐶','🐱','🐰','🐻','🐼','🐸',
  '🐝','🦋','🍎','🍌','🍇','🍓'
];

const SIZES = {
  facil:    {rows:4, cols:6, pairs:12, name:'Fácil'},
  medio:    {rows:6, cols:6, pairs:18, name:'Medio'},
  completo: {rows:6, cols:8, pairs:24, name:'Completo'}
};

/* ============ ESTADO ============ */
let state = {
  rows: 0,
  cols: 0,
  grid: [],          // 2D [{symbol, present}]
  selected: null,    // {r, c}
  size: 'medio',
  timer: 0,
  timerInt: null,
  paused: false,
  pistas: 5,
  movimientos: 0,
  resuelto: false,
  hintPair: null
};
let stats = {jugados:0, ganados:0, mejor:{facil:null,medio:null,completo:null}};

/* ============ TEMA ============ */
function th(t){
  document.documentElement.setAttribute('data-theme',t);
  $('tb').textContent=t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#0d1a12':'#f5f2e8');
  try{localStorage.setItem(TK,t);}catch(e){}
}

/* ============ TOAST ============ */
let TT;
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(TT);TT=setTimeout(()=>e.classList.remove('sh'),2000);}

/* ============ UTILIDADES ============ */
function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function esLibre(grid,r,c,rows,cols){
  // Una ficha es libre si no tiene vecino inmediatamente a la izquierda
  // O no tiene vecino inmediatamente a la derecha
  const left = (c===0) ? false : grid[r][c-1] && grid[r][c-1].present;
  const right = (c===cols-1) ? false : grid[r][c+1] && grid[r][c+1].present;
  return !left || !right;
}

function quedanFichas(grid,rows,cols){
  let n=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c].present)n++;
  return n;
}

function buscarParejaLibre(grid,rows,cols,excluir){
  const libres=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(!grid[r][c].present)continue;
    if(!esLibre(grid,r,c,rows,cols))continue;
    libres.push({r,c,symbol:grid[r][c].symbol});
  }
  for(let i=0;i<libres.length;i++){
    for(let j=i+1;j<libres.length;j++){
      if(libres[i].symbol===libres[j].symbol){
        // Verificar que no es la misma ficha ya excluida
        return [libres[i], libres[j]];
      }
    }
  }
  return null;
}

function esSolucionable(grid,rows,cols){
  const g = grid.map(row=>row.map(t=>({...t})));
  let progreso=true;
  while(progreso){
    progreso=false;
    const par = buscarParejaLibre(g,rows,cols);
    if(par){
      g[par[0].r][par[0].c].present=false;
      g[par[1].r][par[1].c].present=false;
      progreso=true;
    }
  }
  return quedanFichas(g,rows,cols)===0;
}

/* ============ GENERAR TABLERO ============ */
function generarTablero(sizeKey){
  const {rows,cols,pairs} = SIZES[sizeKey];
  const symbols=[];
  for(let i=0;i<pairs;i++){
    symbols.push(SYMBOLS[i]);
    symbols.push(SYMBOLS[i]);
  }
  // Intentar generar un tablero solucionable
  let attempts=0;
  let grid;
  do{
    shuffleArray(symbols);
    grid=[];
    let idx=0;
    for(let r=0;r<rows;r++){
      grid[r]=[];
      for(let c=0;c<cols;c++){
        grid[r][c]={symbol:symbols[idx++],present:true};
      }
    }
    attempts++;
  }while(!esSolucionable(grid,rows,cols) && attempts<30);
  return grid;
}

/* ============ NUEVA PARTIDA ============ */
function nuevaPartida(sizeKey){
  const size = SIZES[sizeKey];
  state.size = sizeKey;
  state.rows = size.rows;
  state.cols = size.cols;
  state.grid = generarTablero(sizeKey);
  state.selected = null;
  state.pistas = 5;
  state.movimientos = 0;
  state.timer = 0;
  state.resuelto = false;
  state.hintPair = null;
  stats.jugados++;
  guardarStats();
  render();
  iniciarTimer();
  toast('✓ '+size.name+' · '+size.pairs+' parejas');
}

/* ============ RENDER ============ */
function render(){
  const board=$('board');
  board.style.gridTemplateColumns='repeat('+state.cols+',1fr)';
  board.style.gridTemplateRows='repeat('+state.rows+',1fr)';
  // Ajustar tamaño del contenedor para que quepa
  const wrapper=board.parentElement;
  const ww=wrapper.clientWidth-20;
  const wh=wrapper.clientHeight-20;
  const gap=4;
  const maxTileByWidth=Math.floor((ww-(state.cols-1)*gap)/state.cols);
  const maxTileByHeight=Math.floor((wh-(state.rows-1)*gap)/state.rows);
  const tileSize=Math.min(maxTileByWidth,maxTileByHeight);
  const boardW=tileSize*state.cols+(state.cols-1)*gap+12;
  const boardH=tileSize*state.rows+(state.rows-1)*gap+12;
  board.style.width=boardW+'px';
  board.style.height=boardH+'px';
  // Fuente de las fichas
  const fontSize=Math.floor(tileSize*0.62);

  board.innerHTML='';
  for(let r=0;r<state.rows;r++){
    for(let c=0;c<state.cols;c++){
      const t=state.grid[r][c];
      const el=document.createElement('div');
      el.className='tile';
      el.style.fontSize=fontSize+'px';
      el.dataset.r=r;
      el.dataset.c=c;
      if(!t.present){
        el.classList.add('gone');
        el.textContent='';
      }else{
        el.textContent=t.symbol;
        const libre=esLibre(state.grid,r,c,state.rows,state.cols);
        if(libre)el.classList.add('lib');
        else el.classList.add('bloq');
        if(state.selected && state.selected.r===r && state.selected.c===c){
          el.classList.add('sel');
        }
        if(state.hintPair){
          const hp=state.hintPair;
          if((hp[0].r===r&&hp[0].c===c)||(hp[1].r===r&&hp[1].c===c)){
            el.classList.add('hint');
          }
        }
      }
      el.onclick=()=>tapFicha(r,c);
      board.appendChild(el);
    }
  }

  $('tiempo').textContent=formatTiempo(state.timer);
  $('restantes').textContent=quedanFichas(state.grid,state.rows,state.cols);
  $('pistas').textContent=state.pistas;
}

function formatTiempo(s){
  const m=Math.floor(s/60);
  const ss=s%60;
  return m+':'+String(ss).padStart(2,'0');
}

/* ============ INTERACCIÓN ============ */
function tapFicha(r,c){
  if(state.resuelto)return;
  const t=state.grid[r][c];
  if(!t.present)return;
  // ¿Es libre?
  if(!esLibre(state.grid,r,c,state.rows,state.cols)){
    toast('Esta ficha está bloqueada');
    if(navigator.vibrate)navigator.vibrate(30);
    return;
  }
  // Limpiar pista si había
  state.hintPair=null;

  // Si no hay selección previa, seleccionar
  if(!state.selected){
    state.selected={r,c};
    if(navigator.vibrate)navigator.vibrate(10);
    render();
    return;
  }
  // Si toco la misma ficha, deseleccionar
  if(state.selected.r===r && state.selected.c===c){
    state.selected=null;
    render();
    return;
  }
  // ¿Coinciden?
  const prev=state.grid[state.selected.r][state.selected.c];
  if(prev.symbol===t.symbol){
    // Match
    state.grid[state.selected.r][state.selected.c].present=false;
    state.grid[r][c].present=false;
    state.selected=null;
    state.movimientos++;
    if(navigator.vibrate)navigator.vibrate([40,30,40]);
    render();
    // Comprobar estado
    setTimeout(comprobarEstado, 350);
  }else{
    // No coinciden
    state.selected={r,c};
    if(navigator.vibrate)navigator.vibrate([20,40,20]);
    render();
  }
}

function comprobarEstado(){
  const restantes = quedanFichas(state.grid,state.rows,state.cols);
  if(restantes===0){
    ganar();
    return;
  }
  // ¿Hay parejas libres?
  const par = buscarParejaLibre(state.grid,state.rows,state.cols);
  if(!par){
    // Sin movimientos
    pararTimer();
    $('modalSinMov').classList.add('act');
  }
}

function ganar(){
  state.resuelto=true;
  pararTimer();
  stats.ganados++;
  const mejorActual=stats.mejor[state.size];
  if(mejorActual===null || state.timer<mejorActual){
    stats.mejor[state.size]=state.timer;
  }
  guardarStats();
  $('winStats').innerHTML=
    'Nivel: <strong>'+SIZES[state.size].name+'</strong><br>'+
    'Tiempo: <strong>'+formatTiempo(state.timer)+'</strong><br>'+
    'Movimientos: <strong>'+state.movimientos+'</strong><br>'+
    'Mejor tiempo en este nivel: <strong>'+formatTiempo(stats.mejor[state.size])+'</strong>';
  $('modalWin').classList.add('act');
  if(navigator.vibrate)navigator.vibrate([100,60,100,60,200]);
}

/* ============ TIMER ============ */
function iniciarTimer(){
  pararTimer();
  state.timerInt=setInterval(()=>{
    if(state.paused||state.resuelto)return;
    state.timer++;
    $('tiempo').textContent=formatTiempo(state.timer);
  },1000);
  $('tiempo').textContent=formatTiempo(state.timer);
}
function pararTimer(){if(state.timerInt){clearInterval(state.timerInt);state.timerInt=null;}}

/* ============ PISTA ============ */
function usarPista(){
  if(state.resuelto)return;
  if(state.pistas<=0){toast('Sin pistas disponibles');return;}
  const par = buscarParejaLibre(state.grid,state.rows,state.cols);
  if(!par){toast('No hay parejas disponibles');return;}
  state.pistas--;
  state.hintPair=par;
  render();
  toast('💡 Pista: '+par[0].symbol);
  // Quitar resaltado tras unos segundos
  setTimeout(()=>{
    state.hintPair=null;
    render();
  },3500);
}

/* ============ MEZCLAR ============ */
function mezclar(){
  if(state.resuelto)return;
  // Recolectar símbolos de fichas presentes
  const symbols=[];
  for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){
    if(state.grid[r][c].present)symbols.push(state.grid[r][c].symbol);
  }
  // Recolocar en un tablero solucionable
  let attempts=0;
  let grid;
  do{
    shuffleArray(symbols);
    grid=[];
    let idx=0;
    for(let r=0;r<state.rows;r++){
      grid[r]=[];
      for(let c=0;c<state.cols;c++){
        if(state.grid[r][c].present){
          grid[r][c]={symbol:symbols[idx++],present:true};
        }else{
          grid[r][c]={symbol:null,present:false};
        }
      }
    }
    attempts++;
  }while(!esSolucionable(grid,state.rows,state.cols) && attempts<30);
  state.grid=grid;
  state.selected=null;
  state.hintPair=null;
  render();
  toast('🔀 Fichas mezcladas');
}

/* ============ REINICIAR ============ */
function reiniciar(){
  if(!confirm('¿Reiniciar la partida actual? Se perderá el progreso.'))return;
  nuevaPartida(state.size);
}

/* ============ STATS ============ */
function guardarStats(){try{localStorage.setItem(LS_STATS,JSON.stringify(stats));}catch(e){}}
function cargarStats(){
  try{
    const r=localStorage.getItem(LS_STATS);
    if(r){const d=JSON.parse(r);Object.assign(stats,d);}
    if(!stats.mejor)stats.mejor={facil:null,medio:null,completo:null};
  }catch(e){}
}

/* ============ INIT ============ */
function init(){
  $('year').textContent=new Date().getFullYear();
  th(localStorage.getItem(TK)||'dark');
  cargarStats();

  $('tb').onclick=()=>{const c=document.documentElement.getAttribute('data-theme')||'dark';th(c==='dark'?'light':'dark');};

  $('btnPista').onclick=usarPista;
  $('btnMezclar').onclick=mezclar;
  $('btnNuevo').onclick=()=>$('modalNuevo').classList.add('act');
  $('btnReiniciar').onclick=reiniciar;

  document.querySelectorAll('.dif-op').forEach(b=>{
    b.onclick=()=>{
      $('modalNuevo').classList.remove('act');
      nuevaPartida(b.dataset.d);
    };
  });
  $('nuevoClose').onclick=()=>$('modalNuevo').classList.remove('act');
  $('modalNuevo').addEventListener('click',e=>{if(e.target.id==='modalNuevo')$('modalNuevo').classList.remove('act');});

  $('winClose').onclick=()=>$('modalWin').classList.remove('act');
  $('winNuevo').onclick=()=>{$('modalWin').classList.remove('act');$('modalNuevo').classList.add('act');};

  $('smReiniciar').onclick=()=>{$('modalSinMov').classList.remove('act');reiniciar();};
  $('smMezclar').onclick=()=>{$('modalSinMov').classList.remove('act');mezclar();};

  // Pausa al minimizar
  document.addEventListener('visibilitychange',()=>{
    state.paused = document.visibilityState==='hidden';
  });

  // Redibujar al girar el teléfono
  window.addEventListener('resize',()=>{if(state.rows>0)render();});

  // Primera pantalla: elegir dificultad
  $('modalNuevo').classList.add('act');
  // Mostrar un tablero vacío detrás para que no se vea en blanco
  $('board').innerHTML='';
}
document.addEventListener('DOMContentLoaded',init);
<\/script>
</body>

.md.op{display:flex;}
.sheet{background:var(--sf);width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetUp .3s cubic-bezier(.32,.72,0,1);}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--tx);font-family:Georgia,serif;font-style:italic;}
.sheet p{font-size:14px;color:var(--tx2);line-height:1.55;margin-bottom:18px;}
.ma{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bp,.bs2,.bd{padding:14px;border-radius:12px;font-size:15px;font-weight:700;}
.bp{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;box-shadow:0 6px 18px rgba(139,92,246,.3);}
.bs2{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);}
.bd{background:var(--dg);color:#fff;}

/* Toast */
.ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:300;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.ts.sh{opacity:1;transform:translateX(-50%) translateY(0);}

footer{padding:8px 16px 14px;text-align:center;font-size:10px;color:var(--tx3);flex-shrink:0;font-style:italic;}

</div>

<\script>
'use strict';

/* ============================================================
   DICCIONARIO DE SÍMBOLOS
   Cada símbolo tiene:
   - id: identificador único
   - n: array de nombres clave para detección (sin tildes, minúsculas)
   - emoji: representación visual
   - t: título visible
   - d: significado base
   - l: matiz "luz" (cuando es positivo)
   - s: matiz "sombra" (cuando avisa)
   ============================================================ */

var SIMBOLOS = [

/* ===== NATURALEZA (15) ===== */
{id:'agua', n:['agua','aguas','lago','laguna','charco','pozo','manantial'], emoji:'💧', t:'Agua', d:'Representa las emociones, la vida interior, la purificación y lo inconsciente. El agua quieta habla de calma; la que fluye, de movimiento emocional; la sucia o turbia, de confusión.', l:'Renovación, limpieza interior, emociones que fluyen bien.', s:'Emociones desbordadas o estancadas, tristeza no expresada.'},

{id:'fuego', n:['fuego','llama','llamas','incendio','arder'], emoji:'🔥', t:'Fuego', d:'Pasión, transformación, destrucción y renacimiento. Es la energía más intensa del mundo simbólico: puede calentar o quemar. Suele aparecer cuando algo está a punto de cambiar radicalmente.', l:'Pasión, energía creadora, fuerza vital.', s:'Ira, destrucción, miedo a perder el control.'},

{id:'tierra', n:['tierra','suelo','barro','lodo','arcilla'], emoji:'🌍', t:'Tierra', d:'Lo material, lo concreto, el cuerpo, la seguridad. La tierra fértil habla de proyectos que crecen; la tierra seca o estéril, de falta de bases.', l:'Estabilidad, arraigo, bases firmes.', s:'Pesadez, estancamiento, sensación de no avanzar.'},

{id:'viento', n:['viento','brisa','ventisca','aire','ventolera'], emoji:'💨', t:'Viento', d:'El pensamiento, lo invisible, lo que empuja o dispersa. El viento suave trae cambios suaves; el huracán, cambios bruscos.', l:'Libertad, ideas nuevas, movimiento necesario.', s:'Confusión, dispersión, cambios que te zarandean.'},

{id:'mar', n:['mar','oceano','océano','playa','olas','marino'], emoji:'🌊', t:'Mar', d:'El inconsciente profundo, lo inmenso, lo que no se controla. El mar en calma es paz; el mar embravecido, emociones muy fuertes.', l:'Paz interior, conexión profunda con uno mismo.', s:'Miedo a lo desconocido, emociones abrumadoras.'},

{id:'rio', n:['rio','río','riachuelo','arroyo'], emoji:'🏞️', t:'Río', d:'El curso de la vida, el tiempo que fluye. Un río claro indica un camino despejado; un río seco o turbio, dificultades.', l:'Fluir con la vida, camino claro.', s:'Bloqueo, sensación de no poder avanzar.'},

{id:'lluvia', n:['lluvia','llover','chubasco','aguacero','tormenta'], emoji:'🌧️', t:'Lluvia', d:'Purificación y fertilidad, pero también tristeza. La lluvia limpia; el aguacero abruma. A veces aparece antes de una gran claridad.', l:'Limpieza emocional, alivio después de la sequía.', s:'Tristeza, sensación de que todo cae encima.'},

{id:'montana', n:['montana','montaña','monte','cima','cumbre','pico'], emoji:'⛰️', t:'Montaña', d:'Obstáculo a superar o meta elevada. Subirla es esfuerzo; llegar arriba, logro. Estar en su cima es perspectiva; estar perdido en ella, desorientación.', l:'Logro, perspectiva, superación.', s:'Obstáculo grande, esfuerzo excesivo.'},

{id:'arbol', n:['arbol','árbol','arboles','árboles','roble','encina'], emoji:'🌳', t:'Árbol', d:'El ser humano completo: raíces (origen), tronco (presente), ramas (futuro). Un árbol frondoso es plenitud; un árbol seco, corte o pérdida.', l:'Crecimiento, plenitud, conexión con las raíces.', s:'Pérdida, corte, algo que se seca o se rompe.'},

{id:'bosque', n:['bosque','selva','jungla','espesura'], emoji:'🌲', t:'Bosque', d:'Lo desconocido, la exploración interior. Adentrarse en él es adentrarse en uno mismo. Salir del bosque es encontrar claridad.', l:'Exploración, descubrimiento interior.', s:'Confusión, pérdida, miedo a lo que no se ve.'},

{id:'sol', n:['sol','amanecer','atardecer','mediodia','mediodía'], emoji:'☀️', t:'Sol', d:'La conciencia, la claridad, la fuerza vital. El sol naciente es inicio; el sol poniente, cierre de ciclo. Su luz ilumina lo que estaba oculto.', l:'Claridad, energía, vitalidad.', s:'Exceso de exposición, agotamiento.'},

{id:'luna', n:['luna','lunar','plenilunio','creciente','menguante'], emoji:'🌙', t:'Luna', d:'Lo femenino, la intuición, los ciclos, lo oculto. La luna llena es plenitud emocional; la luna nueva, comienzo silencioso. Gobierna lo que no se ve.', l:'Intuición, sensibilidad, ciclos naturales.', s:'Confusión emocional, engaño, lo que no se dice.'},

{id:'estrella', n:['estrella','estrellas','firmamento','constelacion','constelación'], emoji:'⭐', t:'Estrella', d:'Guía, esperanza, orientación. Cuando todo está oscuro, una estrella indica dirección. Muchas estrellas son un universo abierto.', l:'Guía, esperanza, destino claro.', s:'Distancia, algo deseado muy lejos.'},

{id:'nieve', n:['nieve','hielo','escarcha','nevada','frio','frío'], emoji:'❄️', t:'Nieve / hielo', d:'Pureza y silencio, pero también frialdad y parálisis. La nieve cubre todo con calma; el hielo congela lo que debería fluir.', l:'Pureza, calma, silencio fértil.', s:'Frialdad emocional, parálisis, algo congelado.'},

{id:'camino', n:['camino','senda','vereda','ruta','carretera'], emoji:'🛤️', t:'Camino', d:'El destino, la dirección de la vida. Un camino claro es propósito; un camino bifurcado, decisión; un camino perdido, desorientación.', l:'Dirección clara, propósito.', s:'Elección difícil, pérdida de rumbo.'},

/* ===== ANIMALES (14) ===== */
{id:'perro', n:['perro','perra','cachorro','can','canes'], emoji:'🐕', t:'Perro', d:'Fidelidad, protección, instinto. Un perro amistoso es apoyo; un perro que ataca, miedo a la traición o a lo salvaje dentro de ti.', l:'Lealtad, compañía, protección.', s:'Traición, miedo, agresividad propia o ajena.'},

{id:'gato', n:['gato','gata','gatito','felino'], emoji:'🐈', t:'Gato', d:'Independencia, intuición, lo femenino libre. El gato no obedece: acompaña si quiere. Suele aparecer cuando necesitas confiar más en tu instinto.', l:'Intuición, libertad, sensualidad.', s:'Desconfianza, frialdad, algo esquivo.'},

{id:'serpiente', n:['serpiente','vibora','víbora','culebra','sierpe'], emoji:'🐍', t:'Serpiente', d:'Transformación profunda, sabiduría oculta, pero también peligro y engaño. Mudar de piel es renacer; el veneno es daño. Simboliza lo que cambia y lo que acecha.', l:'Sanación, transformación, sabiduría ancestral.', s:'Traición, peligro, algo que se oculta.'},

{id:'pajaro', n:['pajaro','pájaro','ave','aves','pajaros','pájaros','gorrion','gorrión'], emoji:'🐦', t:'Pájaro', d:'Libertad, mensajes, alma. Un pájaro volando es liberación; un pájaro enjaulado, algo que no puede expresarse. Trae noticias o intuiciones.', l:'Libertad, mensajes, elevación.', s:'Algo que no puede salir, mensaje que no llega.'},

{id:'pez', n:['pez','peces','pescado','pescador'], emoji:'🐟', t:'Pez', d:'Lo que emerge del inconsciente. Nadar con peces es estar en contacto con tu profundidad. Pescar es atrapar algo valioso de dentro.', l:'Abundancia, intuición, hallazgo interior.', s:'Algo que se escapa, profundidad que asusta.'},

{id:'caballo', n:['caballo','yegua','potro','corcel'], emoji:'🐎', t:'Caballo', d:'Fuerza vital, instinto, libertad. Montarlo es controlar la propia energía; caerse, perder el control. Es el animal del impulso y del poder personal.', l:'Poder, libertad, fuerza controlada.', s:'Impulso descontrolado, caída, miedo a lo instintivo.'},

{id:'araña', n:['araña','arana','telarana','telaraña','aracnido','arácnido'], emoji:'🕷️', t:'Araña', d:'Paciencia, tejido del destino, pero también trampa. La araña teje con calma; su tela puede atrapar. Aparece cuando algo se está tejiendo lentamente.', l:'Paciencia, creatividad, estrategia.', s:'Trampa, miedo, algo que te enreda.'},

{id:'abeja', n:['abeja','abejas','colmena','enjambre','miel'], emoji:'🐝', t:'Abeja', d:'Trabajo en comunidad, dulzura, esfuerzo colectivo. La miel es recompensa del trabajo; el enjambre, fuerza organizada.', l:'Trabajo fructífero, comunidad, dulzura.', s:'Esfuerzo excesivo, agobio por muchas tareas.'},

{id:'lobo', n:['lobo','lobos','manada','loba'], emoji:'🐺', t:'Lobo', d:'Instinto salvaje, liderazgo, soledad elegida. El lobo es libre pero no doméstico. Aparece cuando hay que defender el territorio propio.', l:'Instinto, liderazgo, fuerza interior.', s:'Soledad, agresividad, defensa excesiva.'},

{id:'leon', n:['leon','león','leona','leones'], emoji:'🦁', t:'León', d:'Autoridad, poder, majestad. El león no grita: ruge. Simboliza el mando natural, el coraje, la dignidad. Suele aparecer cuando asumes tu poder personal.', l:'Poder, coraje, autoridad natural.', s:'Arrogancia, abuso de poder, miedo a destacar.'},

{id:'raton', n:['raton','ratón','ratones','roedor'], emoji:'🐭', t:'Ratón', d:'Pequeñez, astucia, miedo. El ratón sobrevive porque es discreto. Simboliza lo pequeño que se cuela por donde no te das cuenta, o el miedo que te encoge.', l:'Astucia, adaptación, supervivencia.', s:'Miedo, insignificancia, algo pequeño que molesta.'},

{id:'mariposa', n:['mariposa','mariposas','oruga','crisalida','crisálida'], emoji:'🦋', t:'Mariposa', d:'Transformación, belleza frágil, renacimiento. La mariposa es lo que fue oruga y ya no lo es. Simboliza los cambios que te embellecen.', l:'Transformación, belleza, ligereza.', s:'Fragilidad, algo que dura poco, miedo al cambio.'},

{id:'toro', n:['toro','buey','vaca','ganado'], emoji:'🐂', t:'Toro', d:'Fuerza bruta, virilidad, terquedad. El toro embiste de frente. Simboliza la energía masculina directa, pero también la obstinación.', l:'Fuerza, potencia, energía masculina.', s:'Terquedad, agresividad, choque frontal.'},

{id:'aguila', n:['aguila','águila','halcon','halcón','rapaz'], emoji:'🦅', t:'Águila', d:'Visión elevada, poder, mensaje de los dioses. El águila ve desde arriba lo que otros no ven. Simboliza perspectiva y autoridad.', l:'Visión, poder, claridad desde las alturas.', s:'Distancia, frialdad, vista que juzga.'},

/* ===== PERSONAS (8) ===== */
{id:'madre', n:['madre','mama','mamá','mami'], emoji:'👩‍🦰', t:'Madre', d:'Origen, cuidado, lo femenino primigenio. Aparece cuando necesitas protección, cuando hay conflicto con lo materno, o cuando algo pide ser cuidado.', l:'Cuidado, protección, ternura.', s:'Dependencia, conflicto con lo materno, falta de apoyo.'},

{id:'padre', n:['padre','papa','papá','papi'], emoji:'👨', t:'Padre', d:'Autoridad, ley, lo masculino estructurante. Aparece cuando hay que asumir responsabilidad, cuando hay conflicto con la autoridad, o cuando algo pide ser ordenado.', l:'Autoridad, protección, estructura.', s:'Conflictos de poder, exigencia, frialdad.'},

{id:'nino', n:['niño','niña','bebe','bebé','infante','criatura'], emoji:'👶', t:'Niño', d:'El yo interior, la inocencia, lo que nace. Puede ser un proyecto nuevo, una parte de ti que quiere jugar, o una herida de la infancia que pide atención.', l:'Inocencia, creatividad, algo que nace.', s:'Vulnerabilidad, abandono, herida infantil.'},

{id:'anciano', n:['anciano','anciana','abuelo','abuela','viejo','vieja'], emoji:'👴', t:'Anciano', d:'Sabiduría, experiencia, final de ciclo. El anciano es quien ha vivido y puede aconsejar. Aparece cuando necesitas guía o cuando hay que cerrar etapas.', l:'Sabiduría, guía, experiencia.', s:'Vejez, cansancio, miedo al final.'},

{id:'desconocido', n:['desconocido','extrano','extraño','desconocida','extrana','extraña'], emoji:'👤', t:'Desconocido', d:'Lo que aún no conoces de ti. El desconocido del sueño suele ser una parte tuya que no has integrado, o alguien que va a entrar en tu vida.', l:'Descubrimiento, algo nuevo por conocer.', s:'Miedo, amenaza, lo que no se controla.'},

{id:'amigo', n:['amigo','amiga','companero','compañero','companera','compañera'], emoji:'🤝', t:'Amigo', d:'Apoyo, espejo, alianza. Los amigos del sueño suelen representar partes de ti que te acompañan, o vínculos reales que necesitan atención.', l:'Apoyo, alegría, alianza.', s:'Traición, decepción, algo que se rompe.'},

{id:'enemigo', n:['enemigo','enemiga','rival','adversario'], emoji:'⚔️', t:'Enemigo', d:'Conflicto, oposición, algo contra lo que luchas. El enemigo puede ser externo o interno: una parte tuya que sabotea o una situación hostil.', l:'Impulso para defenderse, llamada a la acción.', s:'Miedo, conflicto abierto, división interior.'},

{id:'muerto', n:['muerto','muerta','difunto','cadáver','cadaver','fallecido'], emoji:'💀', t:'Muerto', d:'Fin de ciclo, algo que quedó atrás. El muerto del sueño no es literal: es una etapa cerrada, un vínculo terminado, algo que pide ser enterrado.', l:'Cierre, liberación, descanso.', s:'Duelo no resuelto, culpa, algo que no se suelta.'},

/* ===== ACCIONES (14) ===== */
{id:'caer', n:['caer','caida','caída','cayendo','precipicio'], emoji:'⬇️', t:'Caer', d:'Pérdida de control, miedo al fracaso, inseguridad. Soñar que caes suele acompañar momentos de estrés o de falta de apoyo.', l:'Soltar lastre, dejarse ir con confianza.', s:'Miedo, inestabilidad, sensación de fracaso.'},

{id:'volar', n:['volar','volando','vuelo','planeo'], emoji:'🕊️', t:'Volar', d:'Libertad, elevación, superación de límites. El vuelo del sueño suele indicar deseo de liberarse de algo o sensación de poder personal.', l:'Libertad, poder, elevación.', s:'Huida, evasión, querer escapar de la realidad.'},

{id:'correr', n:['correr','corriendo','carrera'], emoji:'🏃', t:'Correr', d:'Prisa, urgencia, huida. Correr sin avanzar es frustración; correr con ligereza es vitalidad. Habla del ritmo al que sientes tu vida.', l:'Vitalidad, avance rápido.', s:'Ansiedad, prisa, huida de algo.'},

{id:'perseguir', n:['perseguir','persecucion','persecución','persiguiendo','acosar'], emoji:'🎯', t:'Perseguir / ser perseguido', d:'Algo que no puedes soltar, o algo que te acecha. Si persigues, es un deseo o meta. Si te persiguen, es un miedo o responsabilidad que esquivas.', l:'Deseo claro, meta que te mueve.', s:'Ansiedad, miedo, algo que se escapa.'},

{id:'huir', n:['huir','huida','escapar','escapando','escapar'], emoji:'🏃‍♂️', t:'Huir', d:'Evitación, miedo, algo que no quieres enfrentar. Soñar que huyes suele indicar una situación real que estás esquivando.', l:'Prudencia, instinto de supervivencia.', s:'Miedo, evitación, problema sin resolver.'},

{id:'nadar', n:['nadar','nadando','bucear','sumergir'], emoji:'🏊', t:'Nadar', d:'Moverse en el inconsciente, en las emociones. Nadar bien es manejarse con soltura en lo emocional; hundirse es sentirse desbordado.', l:'Fluidez emocional, dominio interior.', s:'Ahogo emocional, sentirse superado.'},

{id:'subir', n:['subir','escalar','ascender','ascenso'], emoji:'🔼', t:'Subir / escalar', d:'Esfuerzo por mejorar, ascenso, superación. Subir una cuesta es esfuerzo; llegar arriba, logro. Habla de tu relación con las metas.', l:'Logro, ascenso, superación.', s:'Esfuerzo excesivo, meta lejana.'},

{id:'bajar', n:['bajar','descender','descenso','bajando'], emoji:'🔽', t:'Bajar / descender', d:'Retorno, descanso, o pérdida de posición. Bajar puede ser sabio (volver a lo esencial) o triste (caer de un lugar).', l:'Humildad, retorno a lo esencial.', s:'Pérdida, caída de estatus, fracaso.'},

{id:'morir', n:['morir','muriendo','muerte','agonia','agonía'], emoji:'⚰️', t:'Morir', d:'Fin de un ciclo, transformación radical. Soñar con la propia muerte rara vez es literal: casi siempre indica el final de una etapa y el comienzo de otra.', l:'Renacimiento, cierre, transformación.', s:'Miedo al cambio, pérdida, angustia.'},

{id:'nacer', n:['nacer','nacimiento','naciendo','parto'], emoji:'🌱', t:'Nacer', d:'Comienzo, proyecto nuevo, algo que se gesta y sale a la luz. Puede ser un hijo literal o cualquier cosa que empieza.', l:'Nuevo comienzo, creación, esperanza.', s:'Miedo a lo nuevo, parto difícil, gestación larga.'},

{id:'perderse', n:['perder','perdido','perdida','perdida','extraviar','extravio','extravío'], emoji:'🗺️', t:'Perderse', d:'Desorientación, falta de rumbo, algo que se escapa. Perderse en un lugar es no saber qué camino tomar en la vida.', l:'Búsqueda, apertura a lo nuevo.', s:'Confusión, desorientación, miedo.'},

{id:'tarde', n:['tarde','tarde','retraso','retrasado','llegar tarde'], emoji:'⏰', t:'Llegar tarde', d:'Miedo a no llegar, presión del tiempo, sensación de que la vida se escapa. Es un símbolo muy común de ansiedad.', l:'Conciencia del tiempo, urgencia útil.', s:'Ansiedad, presión, miedo a fallar.'},

{id:'ahogarse', n:['ahogar','ahogado','ahogando','asfixia','asfixiar'], emoji:'🌊', t:'Ahogarse', d:'Emociones que desbordan, situación que supera. Es el símbolo clásico de sentir que no puedes respirar en la vida real.', l:'Necesidad de pedir ayuda, expresión.', s:'Agobio, ansiedad, emoción desbordada.'},

/* ============================================================
   ESTADO Y CLAVES
   ============================================================ */
var SK = 'onirico_data_v1';
var TK = 'onirico_theme_v1';

var suenos = [];
var idEdicionActual = null;
var idDetalleActual = null;
var busqueda = '';
var confirmarAccion = null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============================================================
   PERSISTENCIA
   ============================================================ */
function cargarSuenos(){
try{
var r = localStorage.getItem(SK);
if(r){
var p = JSON.parse(r);
if(Array.isArray(p)) suenos = p;
}
}catch(e){suenos = [];}
if(!Array.isArray(suenos)) suenos = [];
}

function guardarSuenos(){
try{localStorage.setItem(SK, JSON.stringify(suenos));}catch(e){}
}

/* ============================================================
   TEMA
   ============================================================ */
function aplicarTema(t){
document.documentElement.setAttribute('data-theme', t);
$('btnTema').textContent = t === 'dark' ? '☀️' : '🌙';
var m = document.querySelector('meta[name="theme-color"]');
if(m) m.setAttribute('content', t === 'dark' ? '#0a0a1f' : '#f0ecff');
try{localStorage.setItem(TK, t);}catch(e){}
}

/* ============================================================
   TOAST
   ============================================================ */
var TT;
function toast(m){
var e = $('ts');
e.textContent = m;
e.classList.add('sh');
clearTimeout(TT);
TT = setTimeout(function(){e.classList.remove('sh');}, 2200);
}

/* ============================================================
   ESCANEO DE SÍMBOLOS
   ============================================================ */
function normalizar(texto){
return String(texto||'')
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/\s+/g,' ');
}

function escanearSimbolos(texto){
var norm = normalizar(texto);
if(!norm) return [];
var encontrados = [];
var yaDetectados = {};

for(var i = 0; i < SIMBOLOS.length; i++){
var s = SIMBOLOS[i];
if(yaDetectados[s.id]) continue;
for(var j = 0; j < s.n.length; j++){
var palabra = s.n[j];
var regex = new RegExp('\\b' + palabra.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','i');
if(regex.test(norm)){
encontrados.push(s);
yaDetectados[s.id] = true;
break;
}
}
}
return encontrados;
}

/* ============================================================
   FECHAS
   ============================================================ */
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatearFecha(ts){
var d = new Date(ts);
var dia = DIAS[d.getDay()];
var num = d.getDate();
var mes = MESES[d.getMonth()];
var anio = d.getFullYear();
var h = d.getHours();
var m = d.getMinutes();
var hh = (h < 10 ? '0' : '') + h;
var mm = (m < 10 ? '0' : '') + m;
return dia.charAt(0).toUpperCase() + dia.slice(1) + ', ' + num + ' de ' + mes + ' de ' + anio + ' · ' + hh + ':' + mm;
}

function fechaCorta(ts){
var d = new Date(ts);
var num = d.getDate();
var mes = MESES[d.getMonth()].slice(0,3);
var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
return num + ' ' + mes + ' · ' + hh + ':' + mm;
}

/* ============================================================
   LISTA PRINCIPAL
   ============================================================ */
function renderLista(){
var cont = $('lista');
var lista = suenos.slice();

if(busqueda){
var q = normalizar(busqueda);
lista = lista.filter(function(s){
return normalizar(s.titulo || '').indexOf(q) >= 0 || normalizar(s.texto || '').indexOf(q) >= 0;
});
}

lista.sort(function(a,b){return (b.fecha || 0) - (a.fecha || 0);});

if(!lista.length){
if(busqueda){
cont.innerHTML = '<div class="vacio"><div class="vacio-ic">🔍</div><div class="vacio-t">Sin resultados</div><div class="vacio-x">Ningún sueño coincide con tu búsqueda.</div></div>';
}else{
cont.innerHTML = '<div class="vacio"><div class="vacio-ic">🌙</div><div class="vacio-t">Tu diario onírico está vacío</div><div class="vacio-x">Anota tu primer sueño al despertar, mientras esté fresco. La app detectará los símbolos y te dará su significado universal.</div><button class="vacio-btn" id="vacioBtn">✍️ Anotar mi primer sueño</button></div>';
var vb = $('vacioBtn');
if(vb) vb.onclick = abrirEditorNuevo;
}
return;
}

var html = '';
for(var i = 0; i < lista.length; i++){
var s = lista[i];
var tieneTitulo = s.titulo && s.titulo.trim();
var titulo = tieneTitulo ? esc(s.titulo) : 'Sin título';
var tituloCls = tieneTitulo ? '' : ' em';
var prev = (s.texto || '').replace(/\s+/g,' ').trim();
if(prev.length > 140) prev = prev.slice(0,140) + '…';
var simbolos = s.simbolos || [];
var chips = '';
var maxChips = 4;
for(var j = 0; j < Math.min(simbolos.length, maxChips); j++){
chips += '<span class="sc-chip">' + simbolos[j].emoji + ' ' + esc(simbolos[j].t) + '</span>';
}
if(simbolos.length > maxChips){
chips += '<span class="sc-chip mas">+' + (simbolos.length - maxChips) + ' más</span>';
}
if(!simbolos.length){
chips = '<span class="sc-chip mas">Sin símbolos detectados</span>';
}

html += '<div class="sueno-card" data-id="' + esc(s.id) + '">';
html += '<div class="sc-fecha">✦ ' + esc(fechaCorta(s.fecha)) + '</div>';
html += '<div class="sc-titulo' + tituloCls + '">' + titulo + '</div>';
html += '<div class="sc-prev">' + esc(prev) + '</div>';
html += '<div class="sc-meta"><div class="sc-simbolos">' + chips + '</div></div>';
html += '</div>';
}
cont.innerHTML = html;

var cards = cont.querySelectorAll('.sueno-card');
for(var k = 0; k < cards.length; k++){
(function(el){
el.onclick = function(){ abrirDetalle(el.getAttribute('data-id')); };
})(cards[k]);
}
}

/* ============================================================
   EDITOR
   ============================================================ */
function abrirEditorNuevo(){
idEdicionActual = null;
$('edTitulo').value = '';
$('edTexto').value = '';
$('edFecha').textContent = '✦ ' + formatearFecha(Date.now());
$('edBorrar').style.display = 'none';
actualizarSimbolosEditor();
$('editor').classList.add('op');
setTimeout(function(){ $('edTexto').focus(); }, 250);
}

function abrirEditorEditar(id){
var s = null;
for(var i = 0; i < suenos.length; i++){
if(suenos[i].id === id){ s = suenos[i]; break; }
}
if(!s) return;
idEdicionActual = id;
$('edTitulo').value = s.titulo || '';
$('edTexto').value = s.texto || '';
$('edFecha').textContent = '✦ ' + formatearFecha(s.fecha);
$('edBorrar').style.display = 'block';
actualizarSimbolosEditor();
$('editor').classList.add('op');
}

function cerrarEditor(){
$('editor').classList.remove('op');
idEdicionActual = null;
}

function actualizarSimbolosEditor(){
var texto = $('edTexto').value;
var lista = escanearSimbolos(texto);
var cont = $('edSimbolosLista');
var wrap = $('edSimbolos');
var cuenta = $('edSimbolosCuenta');

cuenta.textContent = lista.length === 0 ? '0' : (lista.length === 1 ? '1 símbolo' : lista.length + ' símbolos');

if(!lista.length){
wrap.classList.remove('op');
return;
}

wrap.classList.add('op');
var html = '';
for(var i = 0; i < lista.length; i++){
html += '<button class="ed-simbolo-chip" data-sim="' + esc(lista[i].id) + '">';
html += '<span class="emoji">' + lista[i].emoji + '</span>' + esc(lista[i].t);
html += '</button>';
}
cont.innerHTML = html;

var chips = cont.querySelectorAll('.ed-simbolo-chip');
for(var k = 0; k < chips.length; k++){
(function(el){
el.onclick = function(){
var sid = el.getAttribute('data-sim');
for(var m = 0; m < SIMBOLOS.length; m++){
if(SIMBOLOS[m].id === sid){
mostrarFichaSimbolo(SIMBOLOS[m]);
break;
}
}
};
})(chips[k]);
}
}

function guardarSueno(){
var titulo = $('edTitulo').value.trim();
var texto = $('edTexto').value.trim();
if(!texto){
toast('Escribe algo antes de guardar');
return;
}
var simbolos = escanearSimbolos(texto);
var simbolosGuardar = simbolos.map(function(s){
return {id:s.id, emoji:s.emoji, t:s.t, d:s.d, l:s.l, s:s.s};
});

if(idEdicionActual){
for(var i = 0; i < suenos.length; i++){
if(suenos[i].id === idEdicionActual){
suenos[i].titulo = titulo;
suenos[i].texto = texto;
suenos[i].simbolos = simbolosGuardar;
suenos[i].editado = Date.now();
break;
}
}
toast('✓ Sueño actualizado');
}else{
suenos.push({
id: uid(),
titulo: titulo,
texto: texto,
fecha: Date.now(),
simbolos: simbolosGuardar
});
toast('✓ Sueño guardado');
}
guardarSuenos();
cerrarEditor();
renderLista();
}

function borrarDesdeEditor(){
if(!idEdicionActual) return;
var id = idEdicionActual;
pedirConfirmar(
'Eliminar sueño',
'Esta acción no se puede deshacer. El sueño se borrará de tu diario.',
function(){
suenos = suenos.filter(function(s){return s.id !== id;});
guardarSuenos();
cerrarEditor();
renderLista();
toast('Sueño eliminado');
}
);
}

/* ============================================================
   DETALLE
   ============================================================ */
function abrirDetalle(id){
var s = null;
for(var i = 0; i < suenos.length; i++){
if(suenos[i].id === id){ s = suenos[i]; break; }
}
if(!s) return;
idDetalleActual = id;

$('detTitulo').textContent = s.titulo && s.titulo.trim() ? s.titulo : 'Sin título';
$('detFecha').textContent = '✦ ' + formatearFecha(s.fecha);

var html = '';
html += '<div class="det-texto">' + esc(s.texto) + '</div>';

var simbolos = s.simbolos || [];
if(simbolos.length){
html += '<div class="det-seccion-tit"><span>✦ Símbolos del sueño</span><span class="cuenta">' + (simbolos.length === 1 ? '1' : simbolos.length) + '</span></div>';
for(var j = 0; j < simbolos.length; j++){
var sim = simbolos[j];
html += '<div class="ficha">';
html += '<div class="ficha-hd"><div class="ficha-emoji">' + sim.emoji + '</div><div class="ficha-titulo">' + esc(sim.t) + '</div></div>';
html += '<div class="ficha-d">' + esc(sim.d) + '</div>';
if(sim.l || sim.s){
html += '<div class="ficha-split">';
if(sim.l){
html += '<div class="ficha-lado ficha-lado-luz"><div class="ficha-lado-lbl">Luz</div><div class="ficha-lado-txt">' + esc(sim.l) + '</div></div>';
}
if(sim.s){
html += '<div class="ficha-lado ficha-lado-sombra"><div class="ficha-lado-lbl">Sombra</div><div class="ficha-lado-txt">' + esc(sim.s) + '</div></div>';
}
html += '</div>';
}
html += '</div>';
}
}else{
html += '<div class="det-sin-simbolos">Esta vez no se han detectado símbolos del diccionario.<br>Prueba a escribir el sueño con más detalle.</div>';
}

$('detBody').innerHTML = html;
$('detBody').scrollTop = 0;
$('detalle').classList.add('op');
}

function cerrarDetalle(){
$('detalle').classList.remove('op');
idDetalleActual = null;
}

function compartirSueno(){
var s = null;
for(var i = 0; i < suenos.length; i++){
if(suenos[i].id === idDetalleActual){ s = suenos[i]; break; }
}
if(!s) return;

var txt = 'SUEÑO DEL ' + formatearFecha(s.fecha).toUpperCase() + '\n\n';
if(s.titulo) txt += s.titulo + '\n\n';
txt += s.texto + '\n\n';
if(s.simbolos && s.simbolos.length){
txt += '─────────────\nSÍMBOLOS\n─────────────\n';
for(var j = 0; j < s.simbolos.length; j++){
txt += '• ' + s.simbolos[j].t + ': ' + s.simbolos[j].d + '\n';
}
}

var nombre = 'Sueno_' + new Date(s.fecha).toISOString().slice(0,10) + '.txt';

try{
var blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = nombre;
a.style.display = 'none';
document.body.appendChild(a);
a.click();
setTimeout(function(){
document.body.removeChild(a);
URL.revokeObjectURL(url);
}, 1500);
toast('✓ Descargado ' + nombre);
}catch(e){
if(navigator.clipboard){
navigator.clipboard.writeText(txt).then(function(){
toast('✓ Copiado al portapapeles');
}).catch(function(){
toast('No se pudo exportar');
});
}else{
toast('No se pudo exportar');
}
}
}

/* ============================================================
   FICHA DE SÍMBOLO (modal)
   ============================================================ */
function mostrarFichaSimbolo(s){
var ficha = document.createElement('div');
ficha.className = 'md op';
ficha.style.alignItems = 'center';
ficha.style.padding = '20px';
ficha.innerHTML = '<div class="sheet" style="border-radius:20px;max-width:420px;width:100%;padding:22px;">' +
'<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">' +
'<div style="font-size:34px;line-height:1;">' + s.emoji + '</div>' +
'<div style="flex:1;min-width:0;"><div style="font-family:Georgia,serif;font-style:italic;font-size:20px;font-weight:700;color:var(--tx);">' + esc(s.t) + '</div></div>' +
'</div>' +
'<div style="font-size:14.5px;line-height:1.7;color:var(--tx);margin-bottom:14px;">' + esc(s.d) + '</div>' +
'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">' +
'<div style="background:var(--bg2);border-radius:10px;padding:10px 12px;"><div style="font-size:10px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Luz</div><div style="font-size:12.5px;line-height:1.55;color:var(--tx);">' + esc(s.l) + '</div></div>' +
'<div style="background:var(--bg2);border-radius:10px;padding:10px 12px;"><div style="font-size:10px;font-weight:800;color:var(--dg);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Sombra</div><div style="font-size:12.5px;line-height:1.55;color:var(--tx);">' + esc(s.s) + '</div></div>' +
'</div>' +
'<button class="bp" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font-size:15px;font-weight:700;border:none;">Entendido</button>' +
'</div>';
document.body.appendChild(ficha);

ficha.addEventListener('click', function(e){
if(e.target === ficha || e.target.tagName === 'BUTTON'){
if(ficha.parentNode) ficha.parentNode.removeChild(ficha);
}
});
}

/* ============================================================
   CONFIRMAR
   ============================================================ */
function pedirConfirmar(titulo, texto, accion){
$('cfTitulo').textContent = titulo;
$('cfTexto').textContent = texto;
confirmarAccion = accion;
$('confirmar').classList.add('op');
}

function cerrarConfirmar(){
$('confirmar').classList.remove('op');
confirmarAccion = null;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
$('year').textContent = new Date().getFullYear();
cargarSuenos();
aplicarTema(localStorage.getItem(TK) || 'dark');

/* Cabecera */
$('btnTema').onclick = function(){
var c = document.documentElement.getAttribute('data-theme') || 'dark';
aplicarTema(c === 'dark' ? 'light' : 'dark');
};
$('btnBuscar').onclick = function(){
var sb = $('sbar');
sb.classList.toggle('op');
if(sb.classList.contains('op')){
$('btnBuscar').classList.add('act');
setTimeout(function(){ $('sinput').focus(); }, 100);
}else{
$('btnBuscar').classList.remove('act');
$('sinput').value = '';
busqueda = '';
renderLista();
}
};
$('sinput').oninput = function(){
busqueda = this.value.trim();
renderLista();
};

/* FAB */
$('fabNuevo').onclick = abrirEditorNuevo;

/* Editor */
$('edAtras').onclick = cerrarEditor;
$('edCancelar').onclick = cerrarEditor;
$('edGuardar').onclick = guardarSueno;
$('edBorrar').onclick = borrarDesdeEditor;
$('edTexto').oninput = actualizarSimbolosEditor;

/* Detalle */
$('detAtras').onclick = cerrarDetalle;
$('detEditar').onclick = function(){
var id = idDetalleActual;
cerrarDetalle();
if(id) setTimeout(function(){ abrirEditorEditar(id); }, 200);
};
$('detCompartir').onclick = compartirSueno;

/* Confirmar */
$('cfNo').onclick = cerrarConfirmar;
$('cfSi').onclick = function(){
var accion = confirmarAccion;
cerrarConfirmar();
if(accion) accion();
};
$('confirmar').addEventListener('click', function(e){
if(e.target.id === 'confirmar') cerrarConfirmar();
});

/* Escape */
document.addEventListener('keydown', function(e){
if(e.key === 'Escape'){
if($('editor').classList.contains('op')) cerrarEditor();
else if($('detalle').classList.contains('op')) cerrarDetalle();
else if($('confirmar').classList.contains('op')) cerrarConfirmar();
}
});

renderLista();
}

if(document.readyState === 'loading'){
document.addEventListener('DOMContentLoaded', init);
}else{
init();
}
<\/script>
</body>
</html>
</script>

<\script>
var LS_DATA='arca_v3_data',LS_CFG='arca_v3_cfg',LS_THEME='arca_v3_theme';

var WA_MSG='Hola, olvide la proteccion de mi app Arca (Scriptorium). Podrias ayudarme?';
var PBKDF2_ITER=100000;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var ttTimer;

var datos={claves:[],tarjetas:[]};
var cfg={senuelo:true,duracion:10,bloqueo:3,metodo:'patron',lineaDefault:''};
var cryptoKey=null,saltGuardado=null,verifGuardada=null;
var claveEdId=null,tarjetaEdId=null,verClaveActual=null,verTarjetaActual=null;
var timerSen=null;
var tabActual='claves';
