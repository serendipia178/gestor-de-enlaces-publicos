{f:'Un error no se convierte en verdad por el hecho de que muchos lo crean.',a:'Atribuida a Mahatma Gandhi'}
];

/* Preguntas guía: rotan por día */
var PREGUNTAS = [
'¿Qué te sugiere esta frase en tu vida ahora mismo?',
'¿Con qué momento o persona la relacionas?',
'¿Qué cambiarías si la tomaras en serio?',
'¿Qué te cuesta aceptar de lo que dice?',
'¿Qué parte de ti se resiste a ella?',
'¿Cómo la aplicarías mañana, en algo pequeño?',
'¿Qué te revela sobre ti mismo?',
'¿Estás de acuerdo o en desacuerdo? ¿Por qué?',
'¿Qué te impide vivir según ella?',
'¿A quién se la dedicarías?',
'¿Qué te recuerda de tu pasado?',
'¿Qué te pide cambiar?',
'¿Dónde la ves reflejada en otros?',
'¿Qué te hace sentir? Nómbralo con precisión.'
];

/* ============================================================
   ESTADO Y CLAVES
   ============================================================ */
var SK = 'contemplacion_data_v1';
var TK = 'contemplacion_theme_v1';
var QK = 'contemplacion_frase_dia_v1';

var reflexiones = [];
var fraseActual = null;
var esFraseDelDia = true;
var detalleActual = null;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============================================================
   DÍA DEL AÑO
   ============================================================ */
function diaDelAnio(){
var d = new Date();
var inicio = new Date(d.getFullYear(), 0, 0);
var ms = d - inicio;
return Math.floor(ms / 86400000);
}

function fraseDelDia(){
var idx = diaDelAnio() % FRASES.length;
return FRASES[idx];
}

function indiceFraseDelDia(){
return diaDelAnio() % FRASES.length;
}

/* ============================================================
   PERSISTENCIA
   ============================================================ */
function cargarReflexiones(){
try{
var r = localStorage.getItem(SK);
if(r){
var p = JSON.parse(r);
if(Array.isArray(p)) reflexiones = p;
}
}catch(e){reflexiones = [];}
if(!Array.isArray(reflexiones)) reflexiones = [];
}

function guardarReflexiones(){
try{localStorage.setItem(SK, JSON.stringify(reflexiones));}catch(e){}
}

/* ============================================================
   TEMA
   ============================================================ */
function aplicarTema(t){
document.documentElement.setAttribute('data-theme', t);
var btn = $('btnTema');
if(btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
var m = document.querySelector('meta[name="theme-color"]');
if(m) m.setAttribute('content', t === 'dark' ? '#0a0a20' : '#f5f2ff');
try{localStorage.setItem(TK, t);}catch(e){}
}

/* ============================================================
   TOAST
   ============================================================ */
var TT;
function toast(m){
var e = $('ts');
if(!e) return;
e.textContent = m;
e.classList.add('sh');
clearTimeout(TT);
TT = setTimeout(function(){e.classList.remove('sh');}, 2200);
}

/* ============================================================
   FECHAS
   ============================================================ */
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatearFecha(ts){
var d = new Date(ts);
return DIAS[d.getDay()].charAt(0).toUpperCase() + DIAS[d.getDay()].slice(1) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() + ' · ' + (d.getHours()<10?'0':'') + d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
}

function fechaCorta(ts){
var d = new Date(ts);
var mes = MESES[d.getMonth()].slice(0,3);
return d.getDate() + ' ' + mes + ' · ' + (d.getHours()<10?'0':'') + d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
}

/* ============================================================
   MOSTRAR FRASE
   ============================================================ */
function mostrarFrase(frase, esDelDia){
fraseActual = frase;
esFraseDelDia = esDelDia;

$('fraseNum').textContent = esDelDia ? '✦ Frase del día' : '✦ Frase al azar';
$('fraseTexto').textContent = '«' + frase.f + '»';
$('fraseAutor').textContent = '— ' + frase.a;
$('fraseObra').textContent = frase.o ? '(' + frase.o + ')' : '';

/* Preguntas: 3 rotando por día (o aleatorias si es frase al azar) */
var preguntas;
if(esDelDia){
var base = diaDelAnio() * 3;
preguntas = [
PREGUNTAS[base % PREGUNTAS.length],
PREGUNTAS[(base + 5) % PREGUNTAS.length],
PREGUNTAS[(base + 9) % PREGUNTAS.length]
];
}else{
var usadas = {};
preguntas = [];
while(preguntas.length < 3){
var i = Math.floor(Math.random() * PREGUNTAS.length);
if(!usadas[i]){ usadas[i] = true; preguntas.push(PREGUNTAS[i]); }
}
}

var lista = $('pregLista');
lista.innerHTML = '';
for(var j = 0; j < preguntas.length; j++){
var li = document.createElement('li');
li.textContent = preguntas[j];
lista.appendChild(li);
}

/* Limpiar el cuadro de escritura */
$('escTexto').value = '';
actualizarContador();
}

function actualizarContador(){
var t = $('escTexto').value.trim();
var palabras = t ? t.split(/\s+/).length : 0;
$('contador').textContent = palabras === 1 ? '1 palabra' : palabras + ' palabras';
}

function otraFrase(){
var idx = Math.floor(Math.random() * FRASES.length);
mostrarFrase(FRASES[idx], false);
/* Scroll arriba */
$('ct').scrollTop = 0;
}

/* ============================================================
   GUARDAR REFLEXIÓN
   ============================================================ */
function guardarReflexion(){
var texto = $('escTexto').value.trim();
if(!texto){
toast('Escribe algo antes de guardar');
return;
}

var preguntas = [];
var lis = $('pregLista').querySelectorAll('li');
for(var i = 0; i < lis.length; i++){
preguntas.push(lis[i].textContent);
}

reflexiones.push({
id: uid(),
frase: fraseActual.f,
autor: fraseActual.a,
preguntas: preguntas,
texto: texto,
fecha: Date.now()
});
guardarReflexiones();

$('escTexto').value = '';
actualizarContador();
toast('✓ Reflexión guardada');
renderHistorial();
}

/* ============================================================
   HISTORIAL
   ============================================================ */
function renderHistorial(){
var cont = $('listaHist');
var tit = $('titHist');
var cnt = $('cuentaHist');
var wrapVerTodas = $('btnVerTodasWrap');

if(!reflexiones.length){
tit.style.display = 'none';
cont.innerHTML = '<div class="vacio">Aún no has escrito ninguna reflexión.<br>Cuando guardes la primera, aparecerá aquí.</div>';
wrapVerTodas.style.display = 'none';
return;
}

tit.style.display = 'flex';
cnt.textContent = reflexiones.length === 1 ? '1' : reflexiones.length;

var lista = reflexiones.slice().sort(function(a,b){return (b.fecha||0) - (a.fecha||0);});
var visibles = lista.slice(0, 5);

cont.innerHTML = '';
for(var i = 0; i < visibles.length; i++){
var r = visibles[i];
var item = document.createElement('div');
item.className = 'ref-item';

var prev = (r.texto || '').replace(/\s+/g,' ').trim();
if(prev.length > 140) prev = prev.slice(0,140) + '…';

item.innerHTML =
'<div class="ref-fecha">✦ ' + esc(fechaCorta(r.fecha)) + '</div>' +
'<div class="ref-frase">«' + esc(r.frase) + '» — ' + esc(r.autor) + '</div>' +
'<div class="ref-prev">' + esc(prev) + '</div>';

(function(id){
item.onclick = function(){ abrirDetalle(id); };
})(r.id);

cont.appendChild(item);
}

if(lista.length > 5){
wrapVerTodas.style.display = 'block';
$('btnVerTodas').textContent = 'Ver todas las reflexiones (' + lista.length + ')';
}else{
wrapVerTodas.style.display = 'none';
}
}

/* ============================================================
   DETALLE
   ============================================================ */
function abrirDetalle(id){
var r = null;
for(var i = 0; i < reflexiones.length; i++){
if(reflexiones[i].id === id){ r = reflexiones[i]; break; }
}
if(!r) return;
detalleActual = id;

$('detTitulo').textContent = r.autor;
$('detSub').textContent = formatearFecha(r.fecha);

var html = '';
html += '<div class="det-frase">';
html += '<div class="det-frase-txt">«' + esc(r.frase) + '»</div>';
html += '<div class="det-frase-autor">— ' + esc(r.autor) + '</div>';
html += '</div>';

if(r.preguntas && r.preguntas.length){
html += '<div class="preg-card" style="margin-bottom:16px;"><div class="preg-tit"><span class="dot"></span>Preguntas de entonces</div><ul class="preg-lista">';
for(var k = 0; k < r.preguntas.length; k++){
html += '<li>' + esc(r.preguntas[k]) + '</li>';
}
html += '</ul></div>';
}

html += '<div class="det-reflex">' + esc(r.texto) + '</div>';

html += '<div class="det-acciones">';
html += '<button class="det-borrar" id="detBorrar">🗑️ Eliminar</button>';
html += '<button class="det-cerrar" id="detCerrar">Cerrar</button>';
html += '</div>';

$('detBody').innerHTML = html;
$('detBody').scrollTop = 0;

$('detBorrar').onclick = function(){
if(!confirm('¿Eliminar esta reflexión? Esta acción no se puede deshacer.')) return;
reflexiones = reflexiones.filter(function(x){return x.id !== detalleActual;});
guardarReflexiones();
cerrarDetalle();
renderHistorial();
toast('Reflexión eliminada');
};
$('detCerrar').onclick = cerrarDetalle;

$('vistaDetalle').classList.add('op');
}

function cerrarDetalle(){
$('vistaDetalle').classList.remove('op');
detalleActual = null;
}

/* ============================================================
   MODAL HISTORIAL COMPLETO
   ============================================================ */
function abrirHistorialCompleto(){
var cont = $('modalHistContenido');
var lista = reflexiones.slice().sort(function(a,b){return (b.fecha||0) - (a.fecha||0);});

var html = '';
for(var i = 0; i < lista.length; i++){
var r = lista[i];
var prev = (r.texto || '').replace(/\s+/g,' ').trim();
if(prev.length > 180) prev = prev.slice(0,180) + '…';
html += '<div class="ref-item" data-id="' + esc(r.id) + '" style="margin-bottom:10px;">';
html += '<div class="ref-fecha">✦ ' + esc(fechaCorta(r.fecha)) + '</div>';
html += '<div class="ref-frase">«' + esc(r.frase) + '» — ' + esc(r.autor) + '</div>';
html += '<div class="ref-prev">' + esc(prev) + '</div>';
html += '</div>';
}
cont.innerHTML = html;

var items = cont.querySelectorAll('.ref-item');
for(var j = 0; j < items.length; j++){
(function(el){
el.onclick = function(){
var id = el.getAttribute('data-id');
cerrarHistorialModal();
setTimeout(function(){ abrirDetalle(id); }, 200);
};
})(items[j]);
}

$('modalHist').classList.add('op');
}

function cerrarHistorialModal(){
$('modalHist').classList.remove('op');
}

/* ============================================================
   COPIAR
   ============================================================ */
async function copiarFrase(){
if(!fraseActual) return;
var texto = '«' + fraseActual.f + '»\n— ' + fraseActual.a;
try{
await navigator.clipboard.writeText(texto);
toast('✓ Frase copiada');
}catch(e){
var ta = document.createElement('textarea');
ta.value = texto;
ta.style.position = 'fixed';
ta.style.opacity = '0';
document.body.appendChild(ta);
ta.select();
try{
document.execCommand('copy');
toast('✓ Frase copiada');
}catch(_){
toast('No se pudo copiar');
}
document.body.removeChild(ta);
}
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
var yearEl = $('year');
if(yearEl) yearEl.textContent = new Date().getFullYear();

cargarReflexiones();
aplicarTema(localStorage.getItem(TK) || 'dark');

/* Mostrar la frase del día */
mostrarFrase(fraseDelDia(), true);

/* Botones */
$('btnTema').onclick = function(){
var c = document.documentElement.getAttribute('data-theme') || 'dark';
aplicarTema(c === 'dark' ? 'light' : 'dark');
};

$('btnOtra').onclick = otraFrase;
$('btnCopiar').onclick = copiarFrase;
$('btnGuardar').onclick = guardarReflexion;

$('escTexto').addEventListener('input', actualizarContador);

$('btnHistorial').onclick = function(){
if(!reflexiones.length){
toast('Aún no hay reflexiones');
return;
}
abrirHistorialCompleto();
};

$('btnVerTodas').onclick = abrirHistorialCompleto;
$('modalHistX').onclick = cerrarHistorialModal;
$('modalHist').addEventListener('click', function(e){
if(e.target.id === 'modalHist') cerrarHistorialModal();
});

$('detAtras').onclick = cerrarDetalle;

document.addEventListener('keydown', function(e){
if(e.key === 'Escape'){
if($('vistaDetalle').classList.contains('op')) cerrarDetalle();
else if($('modalHist').classList.contains('op')) cerrarHistorialModal();
}
});

renderHistorial();
}

if(document.readyState === 'loading'){
document.addEventListener('DOMContentLoaded', init);
}else{
init();
}

} catch(err){
mostrarError('Error al iniciar: ' + (err.message || err));
}
<\/script>
</body>
</html>
</script>

/* Velocidad · Proyecto Windows Vista Lite · Fernando Juan · octubre 2026 */
/* Mide ping, descarga y subida contra Cloudflare (servidor Miami cercano a Cuba) */

var KEY = 'velocidad_v1';
var CF_DOWN = 'https://speed.cloudflare.com/__down?bytes=';
var CF_UP = 'https://speed.cloudflare.com/__up';

  rapido: {n: 'Rápido', bytes: 2 * 1024 * 1024, upBytes: 512 * 1024, pings: 5},

};

/* ============================================================
   SONIDOS
   ============================================================ */
function getCtx(){
  if(audioCtx && audioCtx.state !== 'closed') return audioCtx;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }catch(e){ return null; }
}
function resume(){
  var c = getCtx(); if(!c) return null;
  if(c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
  return c;
}
function sndInicio(){
  if(!S.sonido) return;
  var ctx = resume(); if(!ctx) return;
  var now = ctx.currentTime;
  var f = [440, 587, 880];
  for(var i=0;i<f.length;i++){
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f[i];
    o.connect(g); g.connect(ctx.destination);
    var ini = now + i * 0.08;
    g.gain.setValueAtTime(0.001, ini);
    g.gain.linearRampToValueAtTime(0.08, ini + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ini + 0.25);
    o.start(ini); o.stop(ini + 0.27);
  }
}
function sndFin(bueno){
  if(!S.sonido) return;
  var ctx = resume(); if(!ctx) return;
  var now = ctx.currentTime;
  var f = bueno ? [659, 880, 1046] : [523, 659, 523];
  for(var i=0;i<f.length;i++){
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f[i];
    o.connect(g); g.connect(ctx.destination);
    var ini = now + i * 0.11;
    g.gain.setValueAtTime(0.001, ini);
    g.gain.linearRampToValueAtTime(0.09, ini + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, ini + 0.4);
    o.start(ini); o.stop(ini + 0.42);
  }
}
function sndError(){
  if(!S.sonido) return;
  var ctx = resume(); if(!ctx) return;
  var now = ctx.currentTime;
  var f = [400, 300];
  for(var i=0;i<f.length;i++){
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = f[i];
    o.connect(g); g.connect(ctx.destination);

    g.gain.setValueAtTime(0.001, ini);
    g.gain.linearRampToValueAtTime(0.09, ini + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ini + 0.18);
    o.start(ini); o.stop(ini + 0.20);
  }
}
function sndClick(){
  if(!S.sonido) return;
  var ctx = resume(); if(!ctx) return;
  var now = ctx.currentTime;
  var o = ctx.createOscillator(); var g = ctx.createGain();

  o.frequency.setValueAtTime(1200, now);
  o.frequency.exponentialRampToValueAtTime(800, now + 0.05);
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.05, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  o.start(now); o.stop(now + 0.10);
}

/* ============================================================

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){

}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function cargar(){
  try{
    var r = localStorage.getItem(KEY);
    if(r){ var j = JSON.parse(r); if(j && typeof j === 'object') S = j; }
  }catch(e){}
  if(!S.historial) S.historial = [];
  if(!S.nivel) S.nivel = 'rapido';
  if(typeof S.sonido === 'undefined') S.sonido = 1;
}
function fHora(ts){
  var d = new Date(ts);
  return (d.getDate()<10?'0':'') + d.getDate() + '/' + (d.getMonth()+1<10?'0':'') + (d.getMonth()+1) +
    ' ' + (d.getHours()<10?'0':'') + d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
}

/* ============================================================
   MEDICION
   ============================================================ */
function medirPing(numPings){
  return new Promise(function(resolve){
    var samples = [];
    var i = 0;
    function next(){
      if(cancelado || i >= numPings){ resolve(samples); return; }
      var t0 = performance.now();
      var url = CF_DOWN + '1&t=' + Date.now();
      fetch(url, {cache: 'no-store'}).then(function(){
        samples.push(performance.now() - t0);
        i++;
        setTimeout(next, 40);
      }).catch(function(){
        i++;
        setTimeout(next, 40);
      });
    }
    next();
  });
}

function medirDescarga(bytes){
  return new Promise(function(resolve, reject){
    var url = CF_DOWN + bytes + '&t=' + Date.now();
    var t0 = performance.now();
    var recibido = 0;
    var ultimoUpdate = 0;
    var pico = 0;
    var muestras = [];

    fetch(url, {cache: 'no-store'}).then(function(r){
      if(!r.ok){ reject(new Error('HTTP ' + r.status)); return; }
      if(r.body && r.body.getReader){
        var reader = r.body.getReader();
        function leer(){
          reader.read().then(function(chunk){
            if(cancelado){ try{ reader.cancel(); }catch(e){} resolve({mbps: pico, muestras: muestras}); return; }
            if(chunk.done){
              var dur = (performance.now() - t0) / 1000;
              var prom = (recibido * 8) / dur / 1000000;
              /* Devolver la mejor de promedio y pico */
              var resultado = Math.max(prom, pico * 0.85);
              resolve({mbps: resultado, muestras: muestras});
              return;
            }
            recibido += chunk.value.length;
            var elapsed = (performance.now() - t0) / 1000;
            var actual = (recibido * 8) / elapsed / 1000000;
            if(actual > pico) pico = actual;
            var now = performance.now();
            if(now - ultimoUpdate > 100){
              ultimoUpdate = now;
              muestras.push({t: elapsed, v: actual});
              onProgreso('descarga', actual, recibido, elapsed, bytes);
            }
            leer();
          }).catch(function(e){ reject(e); });
        }
        leer();
      } else {
        /* Fallback: sin streaming */
        r.arrayBuffer().then(function(buf){
          var dur = (performance.now() - t0) / 1000;
          var mbps = (buf.byteLength * 8) / dur / 1000000;
          resolve({mbps: mbps, muestras: [{t: dur, v: mbps}]});
        }).catch(reject);
      }
    }).catch(function(e){
      reject(e);
    });
  });
}

function medirSubida(bytes){
  return new Promise(function(resolve, reject){
    var data = new Uint8Array(bytes);
    /* Rellenar con datos no comprimibles (para que no haga trampa la red) */
    for(var i=0;i<bytes;i+=1024){
      data[i] = Math.floor(Math.random() * 256);
    }
    var xhr = new XMLHttpRequest();
    var t0 = performance.now();
    var ultimoUpdate = 0;
    var pico = 0;
    var muestras = [];
    xhr.upload.onprogress = function(e){
      if(cancelado){ try{ xhr.abort(); }catch(x){} resolve({mbps: pico, muestras: muestras}); return; }
      var elapsed = (performance.now() - t0) / 1000;
      var actual = (e.loaded * 8) / elapsed / 1000000;
      if(actual > pico) pico = actual;
      var now = performance.now();
      if(now - ultimoUpdate > 100){
        ultimoUpdate = now;
        muestras.push({t: elapsed, v: actual});
        onProgreso('subida', actual, e.loaded, elapsed, bytes);
      }
    };
    xhr.onload = function(){
      var dur = (performance.now() - t0) / 1000;
      var prom = (bytes * 8) / dur / 1000000;
      resolve({mbps: Math.max(prom, pico * 0.85), muestras: muestras});
    };
    xhr.onerror = function(){ reject(new Error('Error de red en subida')); };
    xhr.onabort = function(){ resolve({mbps: pico, muestras: muestras}); };
    try{
      xhr.open('POST', CF_UP, true);
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.send(data);
    }catch(e){ reject(e); }
  });
}

/* ============================================================
   PROGRESO EN VIVO
   ============================================================ */
function onProgreso(fase, mbps, bytes, elapsed, total){
  if(fase === 'descarga'){
    $('vDescarga').textContent = mbps.toFixed(2);
    $('vDescarga').className = 'val midiendo';
    grafico.puntosDL.push({t: elapsed, v: mbps});
    if(mbps > grafico.maxMbps) grafico.maxMbps = mbps * 1.15;
    dibujarGrafico();
  } else if(fase === 'subida'){
    $('vSubida').textContent = mbps.toFixed(2);
    $('vSubida').className = 'val midiendo';
    grafico.puntosUL.push({t: elapsed, v: mbps});
    if(mbps > grafico.maxMbps) grafico.maxMbps = mbps * 1.15;
    dibujarGrafico();
  }
}

/* ============================================================
   TEST COMPLETO
   ============================================================ */
function iniciarTest(){
  if(midiendo) return;
  midiendo = true;
  cancelado = false;
  var cfg = NIVELES[S.nivel];
  grafico.puntosDL = [];
  grafico.puntosUL = [];
  grafico.maxMbps = 10;
  $('vPing').textContent = '—';
  $('vPing').className = 'val';
  $('vDescarga').textContent = '—';
  $('vDescarga').className = 'val';
  $('vSubida').textContent = '—';
  $('vSubida').className = 'val';
  dibujarGrafico();
  $('btnIniciar').style.display = 'none';
  $('btnCancelar').style.display = 'flex';
  sndInicio();

  var resultado = {fecha: Date.now(), ping: null, descarga: null, subida: null, nivel: S.nivel};

  /* Fase 1: Ping */
  $('estado').textContent = 'Midiendo ping...';
  medirPing(cfg.pings).then(function(samples){
    if(cancelado){ finalizar(null); return; }
    if(samples.length){
      var sum = 0;
      for(var i=0;i<samples.length;i++) sum += samples[i];
      var prom = sum / samples.length;
      resultado.ping = Math.round(prom);
      $('vPing').textContent = resultado.ping;
      $('vPing').className = 'val bien';
    } else {
      $('vPing').textContent = '—';
      $('vPing').className = 'val mal';
    }

    /* Fase 2: Descarga */
    $('estado').textContent = 'Midiendo descarga (' + Math.round(cfg.bytes/1024/1024) + ' MB)...';
    return medirDescarga(cfg.bytes);
  }).then(function(res){
    if(cancelado){ finalizar(null); return; }
    if(res){
      resultado.descarga = res.mbps;
      $('vDescarga').textContent = res.mbps.toFixed(2);
      $('vDescarga').className = 'val ' + (res.mbps >= 1 ? 'bien' : 'mal');
    }

    /* Fase 3: Subida */
    $('estado').textContent = 'Midiendo subida (' + Math.round(cfg.upBytes/1024) + ' KB)...';
    return medirSubida(cfg.upBytes);
  }).then(function(res){
    if(cancelado){ finalizar(null); return; }
    if(res){
      resultado.subida = res.mbps;
      $('vSubida').textContent = res.mbps.toFixed(2);
      $('vSubida').className = 'val ' + (res.mbps >= 0.5 ? 'bien' : 'mal');
    }
    finalizar(resultado);
  }).catch(function(e){
    finalizar(null, e);
  });
}

function finalizar(res, error){
  midiendo = false;
  cancelado = false;
  $('btnIniciar').style.display = 'flex';
  $('btnCancelar').style.display = 'none';

  if(error){
    $('estado').textContent = 'Error';
    sndError();
    toast('Error en el test: ' + (error.message || 'desconocido'));
    return;
  }
  if(!res){
    $('estado').textContent = 'Cancelado';
    toast('Test cancelado');
    return;
  }

  /* Guardar en historial */
  S.historial.unshift(res);
  if(S.historial.length > 20) S.historial = S.historial.slice(0, 20);
  persist();
  renderHistorial();

  /* Evaluar resultado */
  var bueno = (res.descarga && res.descarga >= 2) || (res.ping && res.ping < 150);
  sndFin(bueno);
  $('estado').textContent = 'Completado';

  var msg = [];
  if(res.ping) msg.push('Ping ' + res.ping + ' ms');
  if(res.descarga) msg.push('Descarga ' + res.descarga.toFixed(2) + ' Mbps');
  if(res.subida) msg.push('Subida ' + res.subida.toFixed(2) + ' Mbps');
  toast(msg.join(' · '));
}

/* ============================================================
   GRAFICO
   ============================================================ */
function dibujarGrafico(){
  var cv = $('grafico');
  if(!cv) return;
  var rect = cv.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  /* Fondo */
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f0f8ff');
  g.addColorStop(1, '#dceaf5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* Cuadricula */
  ctx.strokeStyle = 'rgba(120,160,200,.25)';
  ctx.lineWidth = 1;
  for(var i = 1; i < 4; i++){
    var y = (H / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  /* Eje Y - escalas */
  ctx.fillStyle = 'rgba(90,120,150,.7)';
  ctx.font = '10px "Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for(var j = 0; j < 4; j++){
    var y2 = (H / 4) * j;
    var val = grafico.maxMbps * (1 - j / 4);
    ctx.fillText(val.toFixed(1), 4, y2 + 4);
  }

  if(grafico.puntosDL.length === 0 && grafico.puntosUL.length === 0){
    ctx.fillStyle = 'rgba(120,150,180,.4)';
    ctx.font = '13px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Sin datos aún', W / 2, H / 2);
    return;
  }

  /* Encontrar duración max para eje X */
  var maxT = 1;
  if(grafico.puntosDL.length) maxT = Math.max(maxT, grafico.puntosDL[grafico.puntosDL.length - 1].t);
  if(grafico.puntosUL.length) maxT = Math.max(maxT, grafico.puntosUL[grafico.puntosUL.length - 1].t);

  function pintar(puntos, color){
    if(puntos.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for(var k = 0; k < puntos.length; k++){
      var x = (puntos[k].t / maxT) * (W - 30) + 30;
      var y = H - (puntos[k].v / grafico.maxMbps) * (H - 10) - 5;
      if(y < 0) y = 0;
      if(k === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  pintar(grafico.puntosDL, '#10893e');
  pintar(grafico.puntosUL, '#2980b9');
}

/* ============================================================
   HISTORIAL
   ============================================================ */
function renderHistorial(){
  var box = $('histLista');
  box.innerHTML = '';
  if(!S.historial.length){
    box.innerHTML = '<div class="hist-vacio">Aún no hay tests realizados</div>';
    return;
  }
  for(var i = 0; i < S.historial.length; i++){
    var h = S.historial[i];
    var d = document.createElement('div');
    d.className = 'hist-item';
    var fecha = document.createElement('span'); fecha.className = 'fecha'; fecha.textContent = fHora(h.fecha);
    var nivel = document.createElement('span'); nivel.className = 'nivel'; nivel.textContent = NIVELES[h.nivel] ? NIVELES[h.nivel].n : h.nivel;
    var vP = document.createElement('span'); vP.className = 'v ping';
    vP.textContent = h.ping ? (h.ping + ' ms') : '—';
    var vD = document.createElement('span'); vD.className = 'v dl';
    vD.textContent = h.descarga ? (h.descarga.toFixed(2) + ' Mbps') : '—';
    var vU = document.createElement('span'); vU.className = 'v ul';
    vU.textContent = h.subida ? (h.subida.toFixed(2) + ' Mbps') : '—';
    /* Orden: fecha, nivel, ping, descarga, subida */
    d.appendChild(fecha);
    d.appendChild(nivel);
    d.appendChild(vP);
    d.appendChild(vD);
    d.appendChild(vU);
    box.appendChild(d);
  }
}

/* ============================================================
   AJUSTES
   ============================================================ */
function abrirAjustes(){
  var m = $('mo'); var b = $('mbox');
  b.innerHTML = '';
  var h = document.createElement('h3'); h.textContent = 'Ajustes del test'; b.appendChild(h);

  var l1 = document.createElement('label'); l1.textContent = 'Tamaño del test'; b.appendChild(l1);
  var o1 = document.createElement('div'); o1.className = 'opts';
  var niveles = [['rapido','Rápido (2 MB)'],['normal','Normal (5 MB)'],['completo','Completo (15 MB)']];
  for(var i = 0; i < niveles.length; i++){
    (function(id, nom){
      var btn = document.createElement('button');
      btn.className = 'opt' + (id === S.nivel ? ' on' : '');
      btn.textContent = nom;
      btn.onclick = function(){
        S.nivel = id; persist();
        var all = o1.querySelectorAll('.opt');
        for(var k = 0; k < all.length; k++) all[k].className = 'opt';
        btn.className = 'opt on';
      };
      o1.appendChild(btn);
    })(niveles[i][0], niveles[i][1]);
  }
  b.appendChild(o1);

  var l2 = document.createElement('label'); l2.textContent = 'Sonidos'; b.appendChild(l2);
  var o2 = document.createElement('div'); o2.className = 'opts';
  var s1 = document.createElement('button');
  s1.className = 'opt' + (S.sonido ? ' on' : '');
  s1.textContent = 'Activados';
  s1.onclick = function(){
    S.sonido = 1; persist();
    s1.className = 'opt on'; s2.className = 'opt';
    sndClick();
  };
  var s2 = document.createElement('button');
  s2.className = 'opt' + (!S.sonido ? ' on' : '');
  s2.textContent = 'Silenciados';
  s2.onclick = function(){
    S.sonido = 0; persist();
    s2.className = 'opt on'; s1.className = 'opt';
  };
  o2.appendChild(s1); o2.appendChild(s2);
  b.appendChild(o2);

  var p = document.createElement('p');
  p.style.cssText = 'font-size:11.5px;color:#7a90a5;font-style:italic;margin:12px 0 0;line-height:1.5;text-align:center';
  p.textContent = 'El test se realiza contra servidores de Cloudflare (el más cercano está en Miami). Mide la velocidad real a esa red, que sirve de referencia para toda tu conexión.';
  b.appendChild(p);

  var btn = document.createElement('button');
  btn.className = 'btn sec';
  btn.textContent = 'Cerrar';
  btn.onclick = function(){ m.className = ''; };
  b.appendChild(btn);

  m.className = 'on';
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  cargar();
  renderHistorial();
  dibujarGrafico();

  $('btnIniciar').onclick = function(){ sndClick(); iniciarTest(); };
  $('btnCancelar').onclick = function(){
    cancelado = true;
    $('estado').textContent = 'Cancelando...';
  };
  $('btnAjustes').onclick = function(){ sndClick(); abrirAjustes(); };
  $('btnBorrarHist').onclick = function(){
    if(!confirm('¿Borrar todo el historial?')) return;
    S.historial = [];
    persist();
    renderHistorial();
    sndClick();
  };

  $('btnMin').onclick = function(){ toast('Usa el botón del launcher para minimizar.'); };
  $('btnMax').onclick = function(){
    var w = $('win');
    if(w.className.indexOf('max') >= 0){ w.className = ''; }
    else { w.className = 'max'; }
    setTimeout(dibujarGrafico, 100);
  };
  $('btnClose').onclick = function(){
    if(midiendo && !confirm('¿Cerrar mientras se está midiendo?')) return;
    try{ window.close(); }catch(e){}
    window.location.href = 'about:blank';
  };

  $('mo').onclick = function(e){ if(e.target === $('mo')) $('mo').className = ''; };

  window.addEventListener('resize', function(){ setTimeout(dibujarGrafico, 100); });
  window.addEventListener('orientationchange', function(){ setTimeout(dibujarGrafico, 300); });

  /* Desbloquear audio */
  document.addEventListener('touchstart', function once(){ resume(); document.removeEventListener('touchstart', once); }, {once:true});
  document.addEventListener('mousedown', function once(){ resume(); document.removeEventListener('mousedown', once); }, {once:true});
}

init();

<\script>
'use strict';

var TK = 'recibe_theme_v1';

function $(id){return document.getElementById(id);}

function aplicarTema(t){
  document.documentElement.setAttribute('data-theme', t);
  $('tb').textContent = t === 'dark' ? 'Claro' : 'Oscuro';
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t === 'dark' ? '#050B24' : '#f5f6fa');
  try{localStorage.setItem(TK, t);}catch(e){}
}

var TT;
function toast(m){
  var e = $('ts');
  e.textContent = m;
  e.classList.add('sh');
  clearTimeout(TT);
  TT = setTimeout(function(){e.classList.remove('sh');}, 2400);
}

/* ============ DIAGNOSTICO ============ */
function diagnosticar(){
  var codigo = $('inCodigo').value;
  var car = codigo.length;
  var lineas = codigo ? codigo.split('\n').length : 0;
  var tieneDoc = /^\s*<!DOCTYPE\s+html/i.test(codigo) ? 'Si' : 'No';
  var tieneCierre = /<\/html>\s*$/i.test(codigo) ? 'Si' : 'No';

  $('statCar').textContent = car;
  $('statLineas').textContent = lineas;
  $('statDoc').textContent = tieneDoc;
  $('statCierre').textContent = tieneCierre;
  $('infoCodigo').textContent = car + ' caracteres, ' + lineas + ' lineas.';

  var avisos = [];
  if(car === 0){
    $('infoDiag').textContent = 'Pega el codigo para ver el diagnostico.';
    $('btnGuardar').disabled = true;
    return;
  }
  if(car < 100){
    avisos.push('Muy corto. Revisa que hayas pegado todo.');
  }
  if(tieneDoc === 'No'){
    avisos.push('No empieza con DOCTYPE. Puede que falte el principio.');
  }
  if(tieneCierre === 'No'){
    avisos.push('No termina con </html>. Puede que falte el final.');
  }
  if(avisos.length === 0){
    $('infoDiag').innerHTML = '<b>Estructura básica detectada.</b> Se detectan el inicio y el cierre del documento. Este diagnóstico no comprueba el funcionamiento del código. Escribe el nombre y guarda.';
  } else {
    $('infoDiag').innerHTML = '<b>Atencion:</b><br>' + avisos.join('<br>');
  }
  actualizarBoton();
}

/* ============ NOMBRE ============ */
function nombreLimpio(s){
  var r = String(s || '').replace(/\.html?$/i, '').replace(/[^A-Za-z0-9\-_]/g, '');
  if(!r) r = 'App';
  return r;
}

function actualizarBoton(){
  var codigo = $('inCodigo').value;
  var nombre = $('inNombre').value.trim();
  var puede = codigo.length > 50 && nombre.length > 0;
  $('btnGuardar').disabled = !puede;
}

/* ============ GUARDAR ============ */
function guardar(){
  var codigo = $('inCodigo').value;
  var rawName=$('inNombre').value.trim();if(!rawName){toast('Falta el nombre');return;}
var nombre=nombreLimpio(rawName);

  if(codigo.length < 50){
    toast('Codigo demasiado corto');
    return;
  }
  if(!nombre){
    toast('Falta el nombre');
    return;
  }

  var nombreFinal = nombre + '.htm';

  /* Detectar si el codigo ya esta en UTF-8 correcto */
  /* Crear Blob con UTF-8 y BOM opcional */
  try{
    /* Aseguramos UTF-8 sin BOM, el navegador lo maneja bien con el meta charset */
    var blob = new Blob([codigo], {type: 'text/html;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nombreFinal;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    toast('Descarga preparada: '+nombreFinal);
  }catch(e){
    toast('No se pudo guardar: ' + e.message);
    return;
  }

  /* El contenido se conserva hasta pulsar Limpiar. */

}

function limpiar(){
  $('inCodigo').value = '';
  $('inNombre').value = '';
  diagnosticar();
}

/* ============ INIT ============ */
function init(){
  $('year').textContent = new Date().getFullYear();
  var initialTheme='dark';try{initialTheme=localStorage.getItem(TK)||'dark'}catch(e){}aplicarTema(initialTheme);

  $('tb').onclick = function(){
    var c = document.documentElement.getAttribute('data-theme') || 'dark';
    aplicarTema(c === 'dark' ? 'light' : 'dark');
  };

  $('inCodigo').addEventListener('input', diagnosticar);
  $('inNombre').addEventListener('input', actualizarBoton);

  $('btnGuardar').onclick = guardar;
  $('btnLimpiar').onclick = function(){
    if(!$('inCodigo').value && !$('inNombre').value){ toast('Ya esta vacio'); return; }
    if(!confirm('Borrar el codigo y el nombre?')) return;
    limpiar();
  };

  diagnosticar();
}

document.addEventListener('DOMContentLoaded', init);
<\/script>
