.grupo-tit .cuenta{font-size:10.5px;color:var(--tx3);font-weight:500;letter-spacing:0;text-transform:none;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}

.card{background:var(--sf);border-radius:14px;padding:14px;box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;gap:8px;min-height:86px;position:relative;overflow:hidden;border:1px solid var(--bd);transition:transform .12s,box-shadow .18s;}
.card:active{transform:scale(.98);box-shadow:var(--sh-lg);}
.card-head{display:flex;align-items:center;gap:8px;min-width:0;}
.card-ic{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.card-nm{font-size:13.5px;font-weight:700;line-height:1.25;word-break:break-word;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;}
.card-desc{font-size:11px;color:var(--tx3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.card-x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--dg);color:#fff;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(239,68,68,.4);}
body.editando .card-x{display:flex;}
body.editando .card{outline:1px dashed var(--dg);outline-offset:-1px;}

.empty{text-align:center;padding:60px 24px;animation:fadeUp .5s ease;}
.empty-ic{font-size:64px;margin-bottom:14px;opacity:.4;}
.empty-t{font-size:17px;font-weight:700;margin-bottom:8px;}
.empty-x{font-size:13.5px;color:var(--tx2);line-height:1.5;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.fab{position:fixed;bottom:24px;right:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(232,133,10,.45);z-index:30;transition:transform .12s;}
.fab:active{transform:scale(.9);}

.md{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.md.act{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{background:var(--sf);width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp .3s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.sheet-hd h2{font-size:19px;font-weight:700;color:var(--tx);}
.sheet-hd .ib{width:38px;height:38px;font-size:16px;background:var(--bg);}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.fld input,.fld select{width:100%;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bd);color:var(--tx);outline:none;font-size:15px;}
.fld input:focus,.fld select:focus{border-color:var(--ac);}
.acts{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px;}
.b{padding:14px;border-radius:12px;font-size:15px;font-weight:700;transition:transform .12s;}
.b.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;box-shadow:0 6px 20px rgba(232,133,10,.3);}
.b.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);}
.b.dng{background:linear-gradient(135deg,#ff5f5f,#d63030);color:#fff;grid-column:1/-1;margin-top:6px;width:100%;}
.b:active{transform:scale(.97);}

.ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.32,.72,0,1);z-index:300;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.ts.sh{opacity:1;transform:translateX(-50%) translateY(0);}

footer{padding:8px 16px 14px;text-align:center;font-size:10px;color:var(--tx3);flex-shrink:0;font-style:italic;}
</style>
</head>
<body>
<div id="app">
<header class="hd">
<div class="hd-left">
<div class="tt">Buscador</div>
<div class="st" id="sub">0 sitios</div>
</div>
<div class="hr">
<button class="ib" id="bs">🔍</button>
<button class="ib" id="be">✏️</button>
<button class="ib" id="bt">🌙</button>
</div>
</header>

<div class="sb" id="sbar"><input id="sinput" placeholder="Buscar sitio..." autocomplete="off"></div>

<p id="reference-note" style="padding:0 16px 10px;font-size:12px;line-height:1.5;color:var(--tx2)">Catálogo local · Los sitios externos requieren conexión. No se garantiza el acceso desde todas las redes. Las fuentes oficiales, académicas y periodísticas tienen funciones distintas.</p><div class="chips" id="ch"></div>

<div class="ct" id="ct"></div>
<div class="empty" id="emp" style="display:none"></div>

<button class="fab" id="fbn">+</button>
</div>

<div class="md" id="smd"><div class="sheet">
<div class="sheet-hd"><h2 id="smt">Nuevo sitio</h2><button class="ib" id="smc">✕</button></div>
<div class="fld"><label>Nombre</label><input id="sn" placeholder="Ej: RAE" maxlength="60"></div>
<div class="fld"><label>URL</label><input id="su" placeholder="https://..." maxlength="200"></div>
<div class="fld"><label>Descripción</label><input id="sd" placeholder="Descripción breve" maxlength="100"></div>
<div class="fld"><label>Categoría</label><select id="sc2"></select></div>
<div class="acts"><button class="b sec" id="scn">Cancelar</button><button class="b pri" id="ssv">Guardar</button></div>
<button class="b dng" id="sdl" style="display:none;">🗑️ Eliminar sitio</button>
</div></div>

<div class="md" id="cmd"><div class="sheet">
<div class="sheet-hd"><h2>¿Eliminar?</h2></div>
<p style="font-size:14px;color:var(--tx2);line-height:1.55;margin-bottom:18px;" id="cmx">Esta acción no se puede deshacer.</p>
<div class="acts"><button class="b sec" id="cmn">Cancelar</button><button class="b dng" id="cmy" style="grid-column:auto;margin-top:0;">Eliminar</button></div>
</div></div>

<div class="ts" id="ts"></div>
<footer>© <span id="year"></span> Fernando Juan · Todos los derechos reservados.</footer>

<\script>
'use strict';
var SK='buscador_data_v1',TK='buscador_theme_v3';
var S={categories:[],sites:[]},F='all',Q='',E=null,edMode=false,PD=null;
function $(i){return document.getElementById(i);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var DEF={categories:[
{id:'c1',name:'Diccionarios',icon:'📚'},
{id:'c2',name:'Noticias Cuba',icon:'🇨🇺'},
{id:'c3',name:'Noticias Int.',icon:'🌍'},
{id:'c4',name:'Lectura',icon:'📖'},
{id:'c5',name:'IA',icon:'🤖'},
{id:'c6',name:'Ortografía',icon:'✍️'},
{id:'c7',name:'Educación',icon:'🎓'}],
sites:[
{id:'s1',name:'RAE',url:'https://www.rae.es',desc:'Real Academia Española',cat:'c1'},
{id:'s2',name:'DLE',url:'https://dle.rae.es',desc:'Diccionario de la lengua',cat:'c1'},
{id:'s3',name:'Fundéu',url:'https://www.fundeu.es',desc:'Español urgente',cat:'c1'},
{id:'s4',name:'WordReference',url:'https://www.wordreference.com',desc:'Diccionario y foros',cat:'c1'},
{id:'s5',name:'ADN Cuba',url:'https://adncuba.com',desc:'Periodismo independiente',cat:'c2'},
{id:'s6',name:'Martí Noticias',url:'https://www.martinoticias.com',desc:'Noticias sin censura',cat:'c2'},
{id:'s7',name:'Cubanet',url:'https://www.cubanet.org',desc:'Prensa independiente',cat:'c2'},
{id:'s8',name:'14ymedio',url:'https://www.14ymedio.com',desc:'Periodismo cubano',cat:'c2'},
{id:'s9',name:'Granma',url:'https://www.granma.cu',desc:'Diario oficial',cat:'c2'},
{id:'s10',name:'BBC Mundo',url:'https://www.bbc.com/mundo',desc:'Noticias internacionales',cat:'c3'},
{id:'s11',name:'DW Español',url:'https://www.dw.com/es',desc:'Deutsche Welle',cat:'c3'},
{id:'s12',name:'RT Español',url:'https://actualidad.rt.com',desc:'Actualidad RT',cat:'c3'},
{id:'s13',name:'Internet Archive',url:'https://archive.org',desc:'Biblioteca universal',cat:'c4'},
{id:'s14',name:'Project Gutenberg',url:'https://www.gutenberg.org',desc:'Libros de dominio público',cat:'c4'},
{id:'s15',name:'Lectura Biónica',url:'https://toolv.com/es/app/lectura-bionica',desc:'Adapta texto para leer',cat:'c4'},
{id:'s16',name:'Duck.ai',url:'https://duck.ai',desc:'Chat IA gratis',cat:'c5'},
{id:'s17',name:'LMArena',url:'https://lmarena.ai',desc:'Compara modelos IA',cat:'c5'},
{id:'s18',name:'Pi AI',url:'https://pi.ai',desc:'Asistente personal',cat:'c5'},
{id:'s19',name:'LanguageTool',url:'https://languagetool.org',desc:'Corrector ortográfico',cat:'c6'},
{id:'s20',name:'Quillbot',url:'https://quillbot.com',desc:'Corrector y parafraseador',cat:'c6'},
{id:'s21',name:'Scribens',url:'https://www.scribens.com',desc:'Corrector gramatical',cat:'c6'},
{id:'s22',name:'MES Cuba',url:'https://www.mes.gob.cu',desc:'Ministerio Educación Superior',cat:'c7'},
{id:'s23',name:'Universidad de La Habana',url:'https://www.uh.cu',desc:'Campus digital',cat:'c7'}
]};

function ensureReferenceV10(){if(S.referenceV10)return;if(!Array.isArray(S.categories))S.categories=[];if(!Array.isArray(S.sites))S.sites=[];var cats=[{id:'v10-cuba',name:'Cuba — datos oficiales',icon:'🇨🇺'},{id:'v10-academia',name:'Consulta abierta',icon:'🎓'},{id:'v10-libros',name:'Bibliotecas y libros',icon:'📚'}],mapping={};cats.forEach(function(cat){var found=S.categories.filter(function(x){return x.id===cat.id||x.name===cat.name})[0];if(found)mapping[cat.id]=found.id;else{S.categories.push(cat);mapping[cat.id]=cat.id}});var add=[{"id": "v10-onei", "name": "ONEI — estadísticas de Cuba", "url": "https://onei.gob.cu/", "desc": "Publicaciones y series estadísticas oficiales.", "cat": "v10-cuba"}, {"id": "v10-bcc", "name": "Banco Central de Cuba", "url": "https://www.bc.gob.cu/", "desc": "Información monetaria, normativa y tasas oficiales.", "cat": "v10-cuba"}, {"id": "v10-bnjm", "name": "Biblioteca Nacional José Martí — catálogos", "url": "https://bnjm.cu/catalogos", "desc": "Consulta bibliográfica de los fondos de la institución.", "cat": "v10-libros"}, {"id": "v10-dloc", "name": "José Martí — colecciones digitales dLOC", "url": "https://dloc.com/collections/ibnjm", "desc": "Materiales digitalizados de la Biblioteca Nacional de Cuba.", "cat": "v10-libros"}, {"id": "v10-clacso", "name": "CLACSO — repositorio abierto", "url": "https://biblioteca-repositorio.clacso.edu.ar/", "desc": "Textos completos de ciencias sociales de América Latina y el Caribe.", "cat": "v10-academia"}, {"id": "v10-clacso-lib", "name": "CLACSO — libros", "url": "https://libreria.clacso.org/", "desc": "Catálogo editorial con colecciones en acceso abierto.", "cat": "v10-libros"}, {"id": "v10-bne", "name": "BNE — guía de hemeroteca cubana", "url": "https://www.bne.es/es/blog/recursosprensa/2019/05/31/biblioteca-digital-cubana-hemeroteca", "desc": "Guía de recursos históricos y publicaciones cubanas.", "cat": "v10-academia"}];function norm(u){return String(u||'').replace(/\/$/,'').toLowerCase()}add.forEach(function(site){if(!S.sites.some(function(x){return norm(x.url)===norm(site.url)})){var item=JSON.parse(JSON.stringify(site));item.cat=mapping[site.cat];S.sites.push(item)}});S.referenceV10=1;if(!save())delete S.referenceV10;}
function load(){
try{
var r=localStorage.getItem(SK);
if(r){
var p=JSON.parse(r);
if(p.categories)S.categories=p.categories;
if(p.sites)S.sites=p.sites;
}
}catch(e){}
if(!S.categories.length&&!S.sites.length){S=JSON.parse(JSON.stringify(DEF));save();}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));return true}catch(e){toast('No se pudo guardar el catálogo. Conserva una copia de tus enlaces.');return false}}
function th(t){
document.documentElement.setAttribute('data-theme',t);
$('bt').textContent=t==='dark'?'☀️':'🌙';
var m=document.querySelector('meta[name="theme-color"]');
if(m)m.setAttribute('content',t==='dark'?'#050B24':'#f5f6fa');
try{localStorage.setItem(TK,t);}catch(e){}
}

var TT;
function toast(m){var e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(TT);TT=setTimeout(function(){e.classList.remove('sh');},2000);}

function render(){
var c=$('ct'),emp=$('emp');
var l=S.sites.slice();
if(F!=='all')l=l.filter(function(s){return s.cat===F;});
if(Q){
var q=Q.toLowerCase();
l=l.filter(function(s){
return s.name.toLowerCase().indexOf(q)>=0||s.url.toLowerCase().indexOf(q)>=0||(s.desc||'').toLowerCase().indexOf(q)>=0;
});
}
var total=S.sites.length;
$('sub').textContent=total===0?'0 sitios':total===1?'1 sitio':total+' sitios';

var chHtml='<button class="chip'+(F==='all'?' act':'')+'" data-c="all">🌐 Todos</button>';
for(var i=0;i<S.categories.length;i++){
var cat=S.categories[i];
var n=0;
for(var j=0;j<S.sites.length;j++)if(S.sites[j].cat===cat.id)n++;
if(n===0)continue;
chHtml+='<button class="chip'+(F===cat.id?' act':'')+'" data-c="'+cat.id+'">'+(cat.icon||'')+' '+esc(cat.name)+'</button>';
}
$('ch').innerHTML=chHtml;
var chs=$('ch').querySelectorAll('.chip');
for(var k=0;k<chs.length;k++){
chs[k].onclick=function(){F=this.getAttribute('data-c');render();};
}

if(!l.length){
c.innerHTML='';
emp.style.display='block';
if(Q){
emp.innerHTML='<div class="empty-ic">🔍</div><div class="empty-t">Sin resultados</div><div class="empty-x">Nada coincide con "'+esc(Q)+'".</div>';
}else{
emp.innerHTML='<div class="empty-ic">🌐</div><div class="empty-t">Sin sitios</div><div class="empty-x">Pulsa el botón + para añadir el primero.</div>';
}
return;
}
emp.style.display='none';

var grupos={};
for(var m=0;m<l.length;m++){
var s=l[m];
if(!grupos[s.cat])grupos[s.cat]=[];
grupos[s.cat].push(s);
}

var html='';
for(var ci=0;ci<S.categories.length;ci++){
var cat2=S.categories[ci];
var ss=grupos[cat2.id];
if(!ss||!ss.length)continue;
html+='<div class="grupo">';
html+='<div class="grupo-tit"><span>'+(cat2.icon||'')+' '+esc(cat2.name)+'</span><span class="cuenta">'+ss.length+'</span></div>';
html+='<div class="grid">';
for(var si=0;si<ss.length;si++){
html+=cardHTML(ss[si]);
}
html+='</div></div>';
delete grupos[cat2.id];
}

var huérfanos=[];
for(var gk in grupos)for(var gj=0;gj<grupos[gk].length;gj++)huérfanos.push(grupos[gk][gj]);
if(huérfanos.length){
html+='<div class="grupo">';
html+='<div class="grupo-tit"><span>📁 Sin categoría</span><span class="cuenta">'+huérfanos.length+'</span></div>';
html+='<div class="grid">';
for(var hi=0;hi<huérfanos.length;hi++)html+=cardHTML(huérfanos[hi]);
html+='</div></div>';
}

c.innerHTML=html;

var cards=c.querySelectorAll('.card');
for(var q2=0;q2<cards.length;q2++){
(function(el){
el.addEventListener('click',function(e){
if(edMode){
e.preventDefault();
os(el.getAttribute('data-id'));
}
});
})(cards[q2]);
}
var xs=c.querySelectorAll('.card-x');
for(var x2=0;x2<xs.length;x2++){
(function(b){
b.onclick=function(e){
e.preventDefault();
e.stopPropagation();
PD=b.getAttribute('data-id');
$('cmd').classList.add('act');
};
})(xs[x2]);
}
}

function cardHTML(s){
var l=(s.name||'?').charAt(0).toUpperCase();
return '<a class="card" data-id="'+esc(s.id)+'" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+
'<button class="card-x" data-id="'+esc(s.id)+'">×</button>'+
'<div class="card-head"><div class="card-ic">'+l+'</div><span class="card-nm">'+esc(s.name)+'</span></div>'+
(s.desc?'<div class="card-desc">'+esc(s.desc)+'</div>':'')+
'</a>';
}

function fillSelect(){
var opts='';
for(var i=0;i<S.categories.length;i++){
var c=S.categories[i];
opts+='<option value="'+c.id+'">'+(c.icon||'')+' '+esc(c.name)+'</option>';
}
$('sc2').innerHTML=opts;
}

function os(id){
E=id||null;
fillSelect();
if(id){
var s=null;
for(var i=0;i<S.sites.length;i++)if(S.sites[i].id===id)s=S.sites[i];
if(!s)return;
$('smt').textContent='Editar sitio';
$('sn').value=s.name;
$('su').value=s.url;
$('sd').value=s.desc||'';
$('sc2').value=s.cat;
$('sdl').style.display='block';
}else{
$('smt').textContent='Nuevo sitio';
$('sn').value='';$('su').value='';$('sd').value='';
$('sc2').value=S.categories[0]?S.categories[0].id:'';
$('sdl').style.display='none';
}
$('smd').classList.add('act');
setTimeout(function(){$('sn').focus();},250);
}

function ss(){
var n=$('sn').value.trim();
var u=$('su').value.trim();
var d=$('sd').value.trim();
var c=$('sc2').value;
if(!n){toast('Falta nombre');return;}
if(!u){toast('Falta URL');return;}
if(!/^https?:\/\//i.test(u))u='https://'+u;
if(E){
for(var i=0;i<S.sites.length;i++){
if(S.sites[i].id===E){
S.sites[i].name=n;
S.sites[i].url=u;
S.sites[i].desc=d;
S.sites[i].cat=c;
}
}
toast('Actualizado');
}else{
S.sites.push({id:uid(),name:n,url:u,desc:d,cat:c});
toast('Añadido');
}
save();
$('smd').classList.remove('act');
render();
}

function init(){
$('year').textContent=new Date().getFullYear();
load();ensureReferenceV10();
th(localStorage.getItem(TK)||'dark');

$('bt').onclick=function(){
var c=document.documentElement.getAttribute('data-theme')||'dark';
th(c==='dark'?'light':'dark');
};
$('bs').onclick=function(){
$('sbar').classList.toggle('op');
if($('sbar').classList.contains('op'))setTimeout(function(){$('sinput').focus();},100);
};
$('sinput').oninput=function(){Q=this.value.trim();render();};
$('be').onclick=function(){
edMode=!edMode;
document.body.classList.toggle('editando',edMode);
$('be').classList.toggle('act',edMode);
$('be').textContent=edMode?'✓':'✏️';
};

$('fbn').onclick=function(){os(null);};
$('smc').onclick=function(){$('smd').classList.remove('act');};
$('scn').onclick=function(){$('smd').classList.remove('act');};
$('ssv').onclick=ss;
$('sdl').onclick=function(){if(E){PD=E;$('cmd').classList.add('act');}};

$('cmn').onclick=function(){$('cmd').classList.remove('act');PD=null;};
$('cmy').onclick=function(){
if(!PD)return;
var nn=[];
for(var i=0;i<S.sites.length;i++)if(S.sites[i].id!==PD)nn.push(S.sites[i]);
S.sites=nn;
PD=null;save();
$('cmd').classList.remove('act');
$('smd').classList.remove('act');
render();
toast('Eliminado');
};

$('smd').addEventListener('click',function(e){if(e.target.id==='smd')$('smd').classList.remove('act');});
$('cmd').addEventListener('click',function(e){if(e.target.id==='cmd'){$('cmd').classList.remove('act');PD=null;}});

render();
}
document.addEventListener('DOMContentLoaded',init);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="b_cabala">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Cábala</title>
<style>
:root{--bg:#f5f3ff;--bg2:#ede9fe;--sf:#fff;--tx:#1a1a2e;--tx2:#5c5c72;--tx3:#9ca3b8;--bd:#e5e0f0;--ac:#8b5cf6;--ac2:#a78bfa;--acs:rgba(139,92,246,.12);--gold:#e8850a;--gold2:#f7b733;--ok:#10b981;--dg:#ef4444;--sh:0 1px 3px rgba(20,20,50,.06);--sh-lg:0 8px 24px rgba(20,20,50,.15);--sep1:#8b5cf6;--sep2:#a78bfa;--sep-line:#d4c5f0;--sep-line-act:#e8850a;}
[data-theme=dark]{--bg:#050b24;--bg2:#0a1238;--sf:#0e1a48;--tx:#f4f6ff;--tx2:#9aa4d0;--tx3:#5f6996;--bd:#1c2960;--ac:#a78bfa;--ac2:#c4b5fd;--acs:rgba(167,139,250,.15);--gold:#f5a623;--gold2:#ffcf6b;--ok:#34d399;--dg:#f87171;--sh:0 4px 22px rgba(0,0,0,.45);--sh-lg:0 8px 30px rgba(0,0,0,.6);--sep1:#a78bfa;--sep2:#c4b5fd;--sep-line:#4c3a8a;--sep-line-act:#f5a623;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;max-width:100%;}
html,body{position:fixed;inset:0;overflow:hidden;width:100%;height:100%;overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .4s,color .3s;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;max-width:100%;}
input,textarea{font-family:inherit;max-width:100%;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;width:100vw;background:radial-gradient(ellipse 90% 50% at 50% 0%,var(--acs),transparent 65%),var(--bg);}
.hd{padding:18px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0;}
.hd-left{flex:1 1 auto;min-width:0;}
.tt{font-family:Georgia,'Palatino Linotype',serif;font-style:italic;font-size:clamp(24px,7vw,30px);font-weight:600;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;}
.st{font-size:11.5px;color:var(--tx2);margin-top:3px;font-style:italic;letter-spacing:.3px;}
.hr{display:flex;gap:6px;flex-shrink:0;}
.ib{width:42px;height:42px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.ib:active{transform:scale(.9);}
.ct{flex:1 1 0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 30px;min-height:0;scrollbar-width:none;}
.ct::-webkit-scrollbar{display:none;}
.intro{text-align:center;padding:12px 8px 20px;}
.intro-icon{font-size:60px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 8px 20px rgba(139,92,246,.35));}
.intro-titulo{font-family:Georgia,serif;font-style:italic;font-size:20px;font-weight:600;color:var(--ac);margin-bottom:8px;}
.intro-texto{font-size:13.5px;line-height:1.65;color:var(--tx2);max-width:400px;margin:0 auto;}
.panel{background:var(--sf);border-radius:16px;border:1px solid var(--bd);box-shadow:var(--sh);padding:18px;margin-bottom:14px;}
.fld{margin-bottom:14px;}
.fld:last-child{margin-bottom:0;}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;}
.fld input{width:100%;padding:14px 15px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bd);color:var(--tx);outline:none;font-size:16px;transition:border-color .2s;}
.fld input:focus{border-color:var(--ac);}
.fecha-row{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:8px;}
.fecha-row .fld{margin-bottom:0;}
.fecha-row input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;}
.fecha-hint{font-size:11px;color:var(--tx3);margin-top:8px;text-align:center;font-style:italic;}
.btn-calcular{display:block;width:100%;padding:18px;border-radius:15px;font-size:16px;font-weight:700;letter-spacing:.4px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--ac));color:#fff;box-shadow:0 6px 22px rgba(180,140,60,.35);margin-bottom:14px;}
.btn-calcular:active{transform:scale(.98);}
.resumen{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(247,183,51,.08));border:1.5px solid var(--ac);border-radius:16px;padding:18px;margin-bottom:16px;text-align:center;}
.resumen-titulo{font-size:11.5px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;}
.resumen-nombre{font-family:Georgia,serif;font-style:italic;font-size:19px;font-weight:600;color:var(--tx);margin-bottom:4px;}
.resumen-fecha{font-size:13px;color:var(--tx2);}
.numeros-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.num-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 10px;box-shadow:var(--sh);text-align:center;cursor:pointer;transition:transform .12s,border-color .2s;}
.num-card:active{transform:scale(.97);}
.num-card.activo{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs),var(--sh);}
.num-etiqueta{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;line-height:1.2;min-height:22px;display:flex;align-items:center;justify-content:center;}
.num-valor{font-family:Georgia,serif;font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.num-nombre{font-size:11.5px;font-weight:600;color:var(--tx2);margin-top:6px;line-height:1.2;}
.detalle{background:var(--sf);border-radius:16px;border:2px solid var(--ac);box-shadow:var(--sh-lg);padding:20px;margin-bottom:14px;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.detalle-hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bd);}
.detalle-num{width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--ac));color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);}
.detalle-titulo{flex:1 1 auto;min-width:0;}
.detalle-etiqueta{font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
.detalle-nombre{font-family:Georgia,serif;font-style:italic;font-size:19px;font-weight:600;color:var(--tx);line-height:1.2;}
.detalle-texto{font-size:14.5px;line-height:1.7;color:var(--tx);}
.detalle-lista{list-style:none;margin-top:10px;padding-left:0;}
.detalle-lista li{font-size:13.5px;line-height:1.6;color:var(--tx2);padding:4px 0 4px 18px;position:relative;}
.detalle-lista li::before{content:'✦';position:absolute;left:0;top:4px;color:var(--gold);font-size:11px;}
.como-se-calcula{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:12px;line-height:1.55;color:var(--tx2);}
.como-se-calcula b{color:var(--tx);font-weight:700;}
.vacio{text-align:center;padding:40px 20px;}
.vacio-icon{font-size:56px;opacity:.4;margin-bottom:14px;}
.vacio-texto{font-size:14px;color:var(--tx2);line-height:1.5;}
.arbol{background:var(--sf);border-radius:16px;border:1px solid var(--bd);box-shadow:var(--sh);padding:18px;margin-bottom:16px;}
.arbol-titulo{font-family:Georgia,serif;font-style:italic;font-size:17px;font-weight:600;color:var(--ac);text-align:center;margin-bottom:16px;}
.arbol-svg{width:100%;max-width:340px;margin:0 auto;display:block;}
.arbol-svg text{font-family:-apple-system,sans-serif;font-weight:700;pointer-events:none;}
.arbol-svg .sep{fill:var(--sep1);stroke:var(--sep2);stroke-width:2;cursor:pointer;transition:fill .2s,stroke .2s;}
.arbol-svg .sep.activo{fill:var(--gold);stroke:var(--gold2);stroke-width:3;filter:drop-shadow(0 0 8px var(--gold2));}
.arbol-svg .sep.propio{stroke-dasharray:4 3;stroke-width:3;}
.arbol-svg .sep-nombre{fill:#fff;font-size:9px;text-anchor:middle;dominant-baseline:middle;}
.arbol-svg .sep-sub{fill:rgba(255,255,255,.85);font-size:6.5px;text-anchor:middle;dominant-baseline:middle;}
.arbol-svg .sendero{stroke:var(--sep-line);stroke-width:1.5;fill:none;transition:stroke .25s,stroke-width .25s;}
.arbol-svg .sendero.activo{stroke:var(--sep-line-act);stroke-width:3;}
.arbol-svg .sep-g{cursor:pointer;}
.sefira-resumen{background:var(--sf);border-radius:16px;border:2px solid var(--gold);box-shadow:var(--sh-lg);padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;cursor:pointer;}
.sefira-resumen:active{transform:scale(.98);}
.sefira-resumen-num{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);}
.sefira-resumen-body{flex:1 1 auto;min-width:0;}
.sefira-resumen-he{font-family:Georgia,serif;font-style:italic;font-size:17px;font-weight:700;color:var(--tx);}
.sefira-resumen-es{font-size:11.5px;color:var(--tx2);margin-top:2px;font-style:italic;}
.sefira-resumen-flecha{font-size:22px;color:var(--tx3);flex-shrink:0;}
.modal-sef{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.modal-sef.act{display:flex;animation:fadeIn .25s ease;}
.sheet-sef{background:var(--sf);width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp .3s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sh-sef{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--bd);}
.sh-sef-num{width:58px;height:58px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);}
.sh-sef-titulo{flex:1 1 auto;min-width:0;}
.sh-sef-he{font-family:Georgia,'Palatino Linotype',serif;font-style:italic;font-size:23px;font-weight:700;color:var(--gold);line-height:1.15;}
.sh-sef-es{font-size:13px;color:var(--tx2);margin-top:3px;font-style:italic;}
.sh-sef-x{width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;cursor:pointer;}
.sh-sef-x:active{transform:scale(.9);}
.sef-bloque{margin-bottom:16px;}
.sef-bloque h4{font-size:11px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.sef-bloque p{font-size:14.5px;line-height:1.7;color:var(--tx);}
.sef-datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.sef-dato{background:var(--bg2);border-radius:10px;padding:10px 12px;border-left:3px solid var(--gold);}
.sef-dato-lbl{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
.sef-dato-val{font-size:13.5px;font-weight:600;color:var(--tx);line-height:1.3;}
.sef-dato-val.full{font-size:12.5px;word-break:break-word;}
.sef-conectadas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.sef-conectada{padding:5px 11px;border-radius:14px;background:var(--acs);color:var(--ac);font-size:11.5px;font-weight:600;border:1px solid var(--ac);cursor:pointer;}
.sef-vicio-virtud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.sef-vv{background:var(--bg2);border-radius:12px;padding:12px;text-align:center;}
.sef-vv-lbl{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
.sef-vv-val{font-family:Georgia,serif;font-style:italic;font-size:16px;font-weight:700;line-height:1.25;}
.sef-vv.virtud .sef-vv-val{color:var(--ok);}
.sef-vv.vicio .sef-vv-val{color:var(--dg);}
.cronica{background:var(--sf);border-radius:16px;border:2px solid var(--gold);box-shadow:var(--sh-lg);padding:22px 20px;margin-top:20px;margin-bottom:14px;}
.cronica-hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--bd);}
.cronica-icon{font-size:34px;flex-shrink:0;}
.cronica-titulo{flex:1 1 auto;min-width:0;font-family:Georgia,'Palatino Linotype',serif;font-style:italic;font-size:19px;font-weight:600;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;}
.cronica-texto{font-family:Georgia,'Palatino Linotype',serif;font-size:15.5px;line-height:1.85;color:var(--tx);text-align:justify;white-space:pre-wrap;}
.cronica-texto b{color:var(--ac);font-weight:700;}
.cronica-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.cronica-btns.full{grid-template-columns:1fr;}
.btn-cronica{padding:14px 10px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.3px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;box-shadow:0 6px 20px rgba(232,133,10,.3);display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-cronica:active{transform:scale(.97);}
.btn-cronica.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-weight:600;}
.md-texto{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.md-texto.act{display:flex;animation:fadeIn .25s ease;}
.md-texto-panel{background:var(--sf);border-radius:18px;padding:20px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-lg);}
.md-texto-panel h3{font-family:Georgia,serif;font-style:italic;font-size:18px;font-weight:600;color:var(--ac);}
.md-texto-panel p{font-size:12.5px;color:var(--tx2);line-height:1.5;}
.md-texto-panel textarea{width:100%;flex:1 1 auto;min-height:300px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'Courier New',monospace;font-size:12.5px;line-height:1.6;resize:none;outline:none;}
.md-texto-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:300;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.ts.sh{opacity:1;transform:translateX(-50%) translateY(0);}
footer{padding:8px 16px 14px;text-align:center;font-size:10px;color:var(--tx3);flex-shrink:0;font-style:italic;}
</style>
</head>
<body>
<div id="app">
<header class="hd">
<div class="hd-left">
<div class="tt">Cábala</div>
<div class="st">un producto de Marcelo Juan</div>
</div>
<div class="hr">
<button class="ib" id="btnTema">🌙</button>
</div>
</header>
<div class="ct" id="ct">
<div class="intro">
<div class="intro-icon">🔮</div>
<div class="intro-titulo">Numerología cabalística y Árbol de la Vida</div>
<p class="intro-texto">Escribe tu nombre completo y tu fecha. Cábala calculará tus números esenciales, tu lugar en el Árbol de la Vida y te mostrará quién eres, de dónde vienes y a dónde vas.</p>
</div>
<div class="panel">

</div></div>

<\script>
'use strict';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ============================================================
   PERSISTENCIA HÍBRIDA
   Intenta localStorage, luego IndexedDB, luego memoria.
   Así funciona en cualquier navegador sin romperse.
============================================================ */
var DB_NAME='cabala_db';
var DB_STORE='cabala_kv';
var dbCache=null;
var memoriaCache={};
var dbIntentada=false;

function abrirDB(){
if(dbCache)return Promise.resolve(dbCache);
if(dbIntentada&&!dbCache)return Promise.resolve(null);
dbIntentada=true;
return new Promise(function(resolve){
try{
if(!window.indexedDB){resolve(null);return;}
var req=indexedDB.open(DB_NAME,1);
var resuelto=false;
function resolver(v){
if(resuelto)return;
resuelto=true;
resolve(v);
}
req.onupgradeneeded=function(e){
var db=e.target.result;
try{if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);}catch(err){}
};
req.onsuccess=function(e){dbCache=e.target.result;resolver(dbCache);};
req.onerror=function(){resolver(null);};
req.onblocked=function(){resolver(null);};
setTimeout(function(){resolver(dbCache||null);},1500);
}catch(e){resolve(null);}
});
}

function pGuardar(clave,valor){
memoriaCache[clave]=valor;
try{localStorage.setItem(clave,valor);}catch(e){}
abrirDB().then(function(db){
if(!db)return;
try{
var tx=db.transaction(DB_STORE,'readwrite');
tx.objectStore(DB_STORE).put(valor,clave);
}catch(e){}
});
}

function pCargar(clave,callback){
try{
var v=localStorage.getItem(clave);
if(v!==null){callback(v);return;}
}catch(e){}
abrirDB().then(function(db){
if(!db){callback(memoriaCache[clave]||null);return;}
try{
var tx=db.transaction(DB_STORE,'readonly');
var req=tx.objectStore(DB_STORE).get(clave);
req.onsuccess=function(){
var v=req.result;
if(v!==undefined&&v!==null)callback(v);
else callback(memoriaCache[clave]||null);
};
req.onerror=function(){callback(memoriaCache[clave]||null);};
}catch(e){callback(memoriaCache[clave]||null);}
});
}

function pBorrar(clave){
delete memoriaCache[clave];
try{localStorage.removeItem(clave);}catch(e){}
abrirDB().then(function(db){
if(!db)return;
try{
var tx=db.transaction(DB_STORE,'readwrite');
tx.objectStore(DB_STORE).delete(clave);
}catch(e){}
});

/* ============ REDUCCIÓN ============ */
function reducir(n){
while(n>9){
if(n===11||n===22||n===33)return n;
var s=0;
while(n>0){s+=n%10;n=Math.floor(n/10);}
n=s;
}
return n;
}
function valorLetra(l){
var up=l.toUpperCase();
up=up.replace(/[ÁÀÂÄ]/g,'A').replace(/[ÉÈÊË]/g,'E').replace(/[ÍÌÎÏ]/g,'I').replace(/[ÓÒÔÖ]/g,'O').replace(/[ÚÙÛÜ]/g,'U').replace(/Ç/g,'C');
if(VALORES[up])return VALORES[up];
if(up==='Ñ')return 5;
return 0;
}
function esVocal(l){
var up=l.toUpperCase();
up=up.replace(/[ÁÀÂÄ]/g,'A').replace(/[ÉÈÊË]/g,'E').replace(/[ÍÌÎÏ]/g,'I').replace(/[ÓÒÔÖ]/g,'O').replace(/[ÚÙÛÜ]/g,'U');
return VOCALES.indexOf(up)>=0;
}
function calcularNombre(nombre){
var soloLetras=nombre.toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÑÀÈÌÒÙÂÊÎÔÛÄËÏÖÜÇ]/g,'');
var sumaTotal=0,sumaVocales=0,sumaConsonantes=0;
for(var i=0;i<soloLetras.length;i++){
var l=soloLetras[i];
var v=valorLetra(l);
sumaTotal+=v;
if(esVocal(l))sumaVocales+=v;
else sumaConsonantes+=v;
}
return {expresion:reducir(sumaTotal),alma:reducir(sumaVocales),personalidad:reducir(sumaConsonantes)};
}
function calcularFecha(dia,mes,anio){
var camino=reducir(dia+mes+anio);
var diaNum=reducir(dia);
return {camino:camino,dia:diaNum};
}
function calcularMadurez(camino,expresion){return reducir(camino+expresion);}

function obtenerTextoPlano(){
if(!datosActuales)return '';
var tmp=document.createElement('div');
tmp.innerHTML=construirCronica(datosActuales);
return tmp.textContent||tmp.innerText||'';
}

function nombreArchivo(){
if(!datosActuales)return 'Cabala.txt';
var nombreLimpio=datosActuales.nombre.replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ ]/g,'').replace(/\s+/g,'_');
var fecha=datosActuales.anio+'-'+('0'+datosActuales.mes).slice(-2)+'-'+('0'+datosActuales.dia).slice(-2);
return 'Cabala_'+nombreLimpio+'_'+fecha+'.txt';
}

function descargarTxt(){
if(!datosActuales){toast('Nada que descargar');return;}
var texto=obtenerTextoPlano();
var archivo=nombreArchivo();

/* Método 1: Blob + <a download> */
try{
var blob=new Blob([texto],{type:'text/plain;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download=archivo;
a.style.display='none';
document.body.appendChild(a);
a.click();
setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
toast('✓ Descargado: '+archivo);
return;
}catch(e){}

/* Método 2: Data URI */
try{
var uri='data:text/plain;charset=utf-8,'+encodeURIComponent(texto);
var a2=document.createElement('a');
a2.href=uri;
a2.download=archivo;
a2.style.display='none';
document.body.appendChild(a2);
a2.click();
setTimeout(function(){document.body.removeChild(a2);},1500);
toast('✓ Descargado: '+archivo);
return;
}catch(e){}

/* Si nada funciona: mostrar el texto */
verTextoCompleto();
toast('Descarga no disponible. Texto mostrado para copiar.');
}

function compartirCronica(){
if(!datosActuales){toast('Nada que compartir');return;}
var texto=obtenerTextoPlano();
if(navigator.share){
navigator.share({
title:'Cábala - '+datosActuales.nombre,
text:texto
}).then(function(){toast('✓ Compartido');}).catch(function(){});
}else{
toast('Compartir no disponible en este navegador');
}
}

function verTextoCompleto(){
if(!datosActuales){toast('Nada que mostrar');return;}
var texto=obtenerTextoPlano();
$('txtCronica').value=texto;
$('mdTexto').classList.add('act');
}

async function copiarTextoDeModal(){
var texto=$('txtCronica').value;
try{
await navigator.clipboard.writeText(texto);
toast('✓ Texto copiado');
}catch(e){
var ta=$('txtCronica');
ta.select();
ta.setSelectionRange(0,999999);
try{document.execCommand('copy');toast('✓ Copiado');}catch(_){toast('No se pudo copiar');}
}
}

function calcular(){
var nombre=$('inpNombre').value.trim();
var dia=parseInt($('inpDia').value,10);
var mes=parseInt($('inpMes').value,10);
var anio=parseInt($('inpAnio').value,10);
if(!nombre){toast('Escribe tu nombre completo');return;}
if(!dia||dia<1||dia>31){toast('Día inválido (1-31)');return;}
if(!mes||mes<1||mes>12){toast('Mes inválido (1-12)');return;}
if(!anio||anio<1900||anio>2100){toast('Año inválido');return;}
var nombres=calcularNombre(nombre);
var fechaCalc=calcularFecha(dia,mes,anio);
var datos={nombre:nombre,dia:dia,mes:mes,anio:anio,fechaTxt:fmtFecha(dia,mes,anio),
camino:fechaCalc.camino,diaNum:fechaCalc.dia,expresion:nombres.expresion,
alma:nombres.alma,personalidad:nombres.personalidad};
datos.dia=datos.diaNum;
datos.madurez=calcularMadurez(datos.camino,datos.expresion);
pGuardar('cabala_ultimo_nombre',nombre);
pGuardar('cabala_ultimo_dia',String(dia));
pGuardar('cabala_ultimo_mes',String(mes));
pGuardar('cabala_ultimo_anio',String(anio));
render(datos);
setTimeout(function(){var el=$('resultados');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100);
}

/* ============ INPUT FECHA ============ */
function bindFechaInputs(){
var d=$('inpDia'),m=$('inpMes'),a=$('inpAnio');
function soloNumeros(inp,max){inp.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,max);});}
soloNumeros(d,2);soloNumeros(m,2);soloNumeros(a,4);
d.addEventListener('input',function(){if(this.value.length===2)m.focus();});
m.addEventListener('input',function(){if(this.value.length===2)a.focus();});
m.addEventListener('keydown',function(e){if(e.key==='Backspace'&&this.value==='')d.focus();});
a.addEventListener('keydown',function(e){if(e.key==='Backspace'&&this.value==='')m.focus();});
[d,m,a].forEach(function(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();calcular();}});});
}

footer{

  font-style:italic;
}

<\script>
'use strict';
const $=id=>document.getElementById(id);
const TK='calculo_theme_v1';
const LS_HIST='calculo_hist_v1';

/* ============ TEMA ============ */
function aplicarTema(t){
  document.documentElement.setAttribute('data-theme',t);
  $('themeBtn').textContent=t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#0f1117':'#f5f2ec');
  try{localStorage.setItem(TK,t);}catch(e){}
  if(currentTab==='graf')setTimeout(dibujarGrafica,50);
}

/* ============ TOAST ============ */
let TT;
function toast(m){const e=$('ts');e.textContent=m;e.classList.add('sh');clearTimeout(TT);TT=setTimeout(()=>e.classList.remove('sh'),1800);}

/* ============ TABS ============ */
let currentTab='calc';
function cambiarTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('act',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('act',p.id==='panel-'+t));
  if(t==='graf')setTimeout(dibujarGrafica,50);
}
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick=()=>cambiarTab(b.dataset.tab);
});

/* ============================================================
   CALCULADORA
   ============================================================ */
let cv='0';            // valor actual
let expr='';           // expresión acumulada para mostrar
let acc=null;          // acumulador
let op=null;           // operación pendiente
let fresh=true;        // siguiente dígito reemplaza el valor
let justEq=false;      // acabamos de pulsar =
let mem=0;             // memoria
let sciMode=false;
let hist=[];

function cargarHist(){
  try{const r=localStorage.getItem(LS_HIST);if(r)hist=JSON.parse(r);if(!Array.isArray(hist))hist=[];}catch(e){hist=[];}
}
function guardarHist(){try{localStorage.setItem(LS_HIST,JSON.stringify(hist.slice(0,30)));}catch(e){}}

function formatNum(s){
  if(s===''||s==='Error'||s==null)return s||'0';
  if(typeof s!=='string')s=String(s);
  if(s.includes('e')||s.includes('E')||s==='∞'||s==='-∞'||s==='NaN')return s;
  const n=parseFloat(s);
  if(isNaN(n))return s;
  if(!s.includes('.'))return n.toLocaleString('es-ES');
  const parts=s.split('.');
  const ent=parseInt(parts[0],10);
  const entF=isNaN(ent)?parts[0]:ent.toLocaleString('es-ES');
  return entF+','+parts[1];
}

function redondear(r){
  if(!isFinite(r))return r>0?'∞':r<0?'-∞':'Error';
  if(isNaN(r))return 'Error';
  return Math.round(r*1e12)/1e12;
}

function renderCalc(){
  const disp=$('dispVal');
  disp.textContent=formatNum(cv);
  const len=disp.textContent.length;
  disp.classList.remove('sm','tn');
  if(len>13)disp.classList.add('tn');
  else if(len>9)disp.classList.add('sm');

  let ex='';
  if(expr)ex=expr;
  else if(op&&acc!==null)ex=formatNum(String(acc))+' '+op;
  $('dispExpr').textContent=ex;

  $('dispMem').textContent=mem!==0?'M: '+formatNum(String(mem)):'';

  // Resaltar operación
  document.querySelectorAll('.key.op').forEach(k=>{
    if(k.dataset.op===op)k.classList.add('act');
    else k.classList.remove('act');
  });
}

function pressDigit(d){
  if(justEq){cv=d;expr='';acc=null;op=null;justEq=false;fresh=false;}
  else if(fresh){cv=d;fresh=false;}
  else if(cv.length<15){
    if(cv==='0')cv=d;
    else if(cv==='-0')cv='-'+d;
    else cv+=d;
  }
  renderCalc();
}
function pressDot(){
  if(justEq){cv='0.';expr='';acc=null;op=null;justEq=false;fresh=false;}
  else if(fresh){cv='0.';fresh=false;}
  else if(!cv.includes('.'))cv+='.';
  renderCalc();
}
function compute(a,b,o){
  switch(o){
    case '+':return a+b;
    case '−':return a-b;
    case '×':return a*b;
    case '÷':return b===0?null:a/b;
    case '^':return Math.pow(a,b);
    case 'mod':return b===0?null:a%b;
  }
  return null;
}
function pressOp(o){
  const cur=parseFloat(cv);
  const n=isNaN(cur)?0:cur;
  if(op!==null&&!fresh){
    const r=compute(acc,n,op);
    if(r===null||!isFinite(r)){cv='Error';expr='';acc=null;op=null;fresh=true;justEq=true;renderCalc();return;}
    acc=redondear(r);
    cv=String(acc);
  }else if(op===null){
    acc=n;
  }
  op=o;fresh=true;justEq=false;
  expr=formatNum(String(acc))+' '+o;
  renderCalc();
}
function pressEq(){
  if(op===null)return;
  let cur;
  if(fresh)cur=acc;
  else{cur=parseFloat(cv);if(isNaN(cur))cur=0;}
  const r=compute(acc,cur,op);
  if(r===null||!isFinite(r)){
    expr=formatNum(String(acc))+' '+op+' '+formatNum(String(cur))+' =';
    cv='Error';acc=null;op=null;fresh=true;justEq=true;renderCalc();return;
  }
  const res=redondear(r);
  const expresion=formatNum(String(acc))+' '+op+' '+formatNum(String(cur));
  cv=String(res);
  expr=expresion+' =';
  hist.unshift({expr:expresion,res:formatNum(String(res)),ts:Date.now()});
  if(hist.length>30)hist=hist.slice(0,30);
  guardarHist();
  acc=null;op=null;fresh=true;justEq=true;
  renderCalc();
}
function pressClear(){
  const limpio=cv==='0'&&acc===null&&op===null&&!justEq&&!expr;
  if(limpio)return;
  if(fresh&&acc!==null&&op!==null){
    cv=String(acc);acc=null;op=null;expr='';fresh=false;
  }else{
    cv='0';expr='';acc=null;op=null;fresh=true;justEq=false;
  }
  renderCalc();
}
function pressBS(){
  if(justEq){cv='0';expr='';justEq=false;fresh=true;renderCalc();return;}
  if(fresh||cv==='0')return;
  if(cv.length<=1||(cv.length===2&&cv.startsWith('-'))){cv='0';fresh=true;}
  else cv=cv.slice(0,-1);
  renderCalc();
}
function pressSign(){
  if(cv==='0'||cv==='Error')return;
  if(cv.startsWith('-'))cv=cv.slice(1);else cv='-'+cv;
  renderCalc();
}
function pressPercent(){
  const n=parseFloat(cv);
  if(isNaN(n))return;
  let r;
  if(acc!==null&&op!==null)r=acc*n/100;
  else r=n/100;
  cv=String(redondear(r));
  fresh=false;
  renderCalc();
}
function applySci(fn){
  const n=parseFloat(cv);
  if(isNaN(n))return;
  let r;
  switch(fn){
    case 'sin':r=Math.sin(n);break;
    case 'cos':r=Math.cos(n);break;
    case 'tan':r=Math.tan(n);break;
    case 'asin':r=Math.asin(n);break;
    case 'acos':r=Math.acos(n);break;
    case 'atan':r=Math.atan(n);break;
    case 'ln':r=Math.log(n);break;
    case 'log':r=Math.log10(n);break;
    case 'sqrt':r=Math.sqrt(n);break;
    case 'sq':r=n*n;break;
    case 'inv':r=1/n;break;
    case 'fact':{
      if(n<0||!Number.isInteger(n)||n>170){toast('Factorial inválido');return;}
      r=1;for(let i=2;i<=n;i++)r*=i;break;
    }
    case 'exp':r=Math.exp(n);break;
    case 'abs':r=Math.abs(n);break;
    default:return;
  }
  if(!isFinite(r)||isNaN(r)){toast('Error');return;}
  cv=String(redondear(r));
  fresh=false;
  justEq=false;
  renderCalc();
}
function insertConst(c){
  if(justEq){cv='';expr='';acc=null;op=null;justEq=false;fresh=false;}
  if(fresh||cv==='0'){cv=c;fresh=false;}
  else cv+=c;
  renderCalc();
}
function memAction(a){
  const n=parseFloat(cv);
  const cur=isNaN(n)?0:n;
  switch(a){
    case 'MC':mem=0;toast('Memoria borrada');break;
    case 'MR':cv=String(mem);fresh=true;justEq=false;break;
    case 'M+':mem+=cur;toast('M+ '+formatNum(String(cur)));break;
    case 'M-':mem-=cur;toast('M− '+formatNum(String(cur)));break;

}

/* ============================================================
   GRÁFICOS
   ============================================================ */
let grafView={xMin:-10,xMax:10,yMin:-10,yMax:10};
let grafFunc=null;

function compilarFuncion(expr){
  try{
    // Preparar expresión: reemplazar ^ por **
    let e=expr.replace(/\^/g,'**');
    // Crear función con Math disponible
    const f=new Function('x',
      'with(Math){return '+e+';}'
    );
    // Probar con un valor
    const test=f(0);
    return f;
  }catch(err){
    return null;
  }
}

function dibujarGrafica(){
  const canvas=$('grafCanvas');
  const wrap=canvas.parentElement;
  const W=wrap.clientWidth;
  const H=wrap.clientHeight;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const bgCard=isDark?'#1a1d26':'#ffffff';
  const axisColor=isDark?'#5a5f6e':'#a1a1a8';
  const gridColor=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const textColor=isDark?'#969aa8':'#6b6b73';
  const funcColor='#b8860b';
  const funcColorBright='#d4a72c';

  ctx.fillStyle=bgCard;
  ctx.fillRect(0,0,W,H);

  const xMin=grafView.xMin,xMax=grafView.xMax,yMin=grafView.yMin,yMax=grafView.yMax;
  const xRange=xMax-xMin;
  const yRange=yMax-yMin;

  const aX=x=>((x-xMin)/xRange)*W;
  const aY=y=>H-((y-yMin)/yRange)*H;

  // Cuadrícula
  ctx.strokeStyle=gridColor;
  ctx.lineWidth=1;
  const pasoX=calcularPaso(xRange);
  const pasoY=calcularPaso(yRange);
  for(let x=Math.ceil(xMin/pasoX)*pasoX;x<=xMax;x+=pasoX){
    const px=aX(x);
    ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();
  }
  for(let y=Math.ceil(yMin/pasoY)*pasoY;y<=yMax;y+=pasoY){
    const py=aY(y);
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
  }

  // Ejes
  ctx.strokeStyle=axisColor;
  ctx.lineWidth=1.5;
  // Eje X
  const y0=aY(0);
  if(y0>=0&&y0<=H){
    ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
  }
  // Eje Y
  const x0=aX(0);
  if(x0>=0&&x0<=W){
    ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,H);ctx.stroke();
  }

  // Números de los ejes
  ctx.fillStyle=textColor;
  ctx.font='10px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='top';
  for(let x=Math.ceil(xMin/pasoX)*pasoX;x<=xMax;x+=pasoX){
    if(Math.abs(x)<0.0001)continue;
    const px=aX(x);
    if(px<15||px>W-15)continue;
    ctx.fillText(String(Math.round(x*10)/10),px,y0+4);
  }
  ctx.textAlign='right';
  ctx.textBaseline='middle';
  for(let y=Math.ceil(yMin/pasoY)*pasoY;y<=yMax;y+=pasoY){
    if(Math.abs(y)<0.0001)continue;
    const py=aY(y);
    if(py<10||py>H-10)continue;
    ctx.fillText(String(Math.round(y*10)/10),x0-4,py);
  }

  // Función
  if(grafFunc){
    ctx.strokeStyle=funcColor;
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.beginPath();
    let started=false;
    let prevY=null;
    const step=1;
    for(let px=0;px<=W;px+=step){
      const x=xMin+(px/W)*xRange;
      let y;
      try{y=grafFunc(x);}catch(e){y=NaN;}
      if(isNaN(y)||!isFinite(y)){started=false;prevY=null;continue;}
      const py=aY(y);
      // Detectar saltos grandes (asíntotas)
      if(prevY!==null&&Math.abs(py-prevY)>H*1.5){started=false;}
      if(!started){ctx.moveTo(px,py);started=true;}
      else ctx.lineTo(px,py);
      prevY=py;
    }
    ctx.stroke();
  }
}

function calcularPaso(rango){
  const objetivo=rango/8;
  const pot=Math.pow(10,Math.floor(Math.log10(objetivo)));
  const n=objetivo/pot;
  let paso;
  if(n<1.5)paso=1;else if(n<3)paso=2;else if(n<7)paso=5;else paso=10;
  return paso*pot;
}

function aplicarFuncion(){
  const input=$('funcInput').value.trim();
  if(!input)return;
  const f=compilarFuncion(input);
  if(!f){
    toast('Función inválida');
    return;
  }
  grafFunc=f;
  dibujarGrafica();
  toast('✓ y = '+input);
}

$('grafGo').onclick=aplicarFuncion;
$('funcInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();aplicarFuncion();}
});
$('zoomIn').onclick=()=>{
  const cx=(grafView.xMin+grafView.xMax)/2;
  const cy=(grafView.yMin+grafView.yMax)/2;
  const f=0.7;
  grafView.xMin=cx+(grafView.xMin-cx)*f;
  grafView.xMax=cx+(grafView.xMax-cx)*f;
  grafView.yMin=cy+(grafView.yMin-cy)*f;
  grafView.yMax=cy+(grafView.yMax-cy)*f;
  dibujarGrafica();
};
$('zoomOut').onclick=()=>{
  const cx=(grafView.xMin+grafView.xMax)/2;
  const cy=(grafView.yMin+grafView.yMax)/2;
  const f=1/0.7;
  grafView.xMin=cx+(grafView.xMin-cx)*f;
  grafView.xMax=cx+(grafView.xMax-cx)*f;
  grafView.yMin=cy+(grafView.yMin-cy)*f;
  grafView.yMax=cy+(grafView.yMax-cy)*f;
  dibujarGrafica();
};
$('resetView').onclick=()=>{
  grafView={xMin:-10,xMax:10,yMin:-10,yMax:10};
  dibujarGrafica();
};

  longitud:{

      'metro':1,'kilómetro':1000,'centímetro':0.01,'milímetro':0.001,

let catActual='longitud';
function renderConvCats(){
  const cont=$('convCats');
  cont.innerHTML=Object.keys(CATEGORIAS).map(k=>{
    const c=CATEGORIAS[k];
    return `<button class="cat ${k===catActual?'act':''}" data-cat="${k}">${c.nombre}</button>`;
  }).join('');
  cont.querySelectorAll('.cat').forEach(b=>{
    b.onclick=()=>{
      catActual=b.dataset.cat;
      renderConvCats();
      renderConvUnits();
      actualizarConv();
    };
  });
}

function renderConvUnits(){
  const cat=CATEGORIAS[catActual];
  const unidades=cat.especial?cat.unidades:Object.keys(cat.unidades);
  const opcionesHTML=unidades.map(u=>`<option value="${u}">${u}</option>`).join('');
  $('unitFrom').innerHTML=opcionesHTML;
  $('unitTo').innerHTML=opcionesHTML;
  if(unidades.length>=2){
    $('unitFrom').value=unidades[0];
    $('unitTo').value=unidades[1];
  }
  $('convNote').textContent=cat.especial?'Conversión de temperatura con fórmulas específicas.':'Conversión directa por factores.';
}

function convertirTemperatura(v,de,a){
  if(de===a)return v;
  let c;
  if(de==='Celsius')c=v;
  else if(de==='Fahrenheit')c=(v-32)*5/9;
  else if(de==='Kelvin')c=v-273.15;
  else c=v;

  if(a==='Celsius')return c;
  if(a==='Fahrenheit')return c*9/5+32;
  if(a==='Kelvin')return c+273.15;
  return c;
}

function actualizarConv(){
  const cat=CATEGORIAS[catActual];
  const v=parseFloat($('convFrom').value);
  if(isNaN(v)){$('convTo').value='';return;}
  const de=$('unitFrom').value;
  const a=$('unitTo').value;
  let r;
  if(cat.especial){
    r=convertirTemperatura(v,de,a);
  }else{
    const base=v*cat.unidades[de];
    r=base/cat.unidades[a];
  }
  // Formatear
  let formatted;
  if(Math.abs(r)>=1e9||(Math.abs(r)<0.0001&&r!==0)){
    formatted=r.toExponential(4);
  }else{
    formatted=Math.round(r*1e8)/1e8;
    formatted=String(formatted);
  }
  $('convTo').value=formatted;
}

$('convFrom').addEventListener('input',actualizarConv);
$('unitFrom').addEventListener('change',actualizarConv);
$('unitTo').addEventListener('change',actualizarConv);

  const u1=$('unitFrom').value;
  const u2=$('unitTo').value;
  $('unitFrom').value=u2;
  $('unitTo').value=u1;
  const v1=$('convFrom').value;
  const v2=$('convTo').value;
  $('convFrom').value=v2;
  actualizarConv();
};

function renderHist(){
  const cont=$('histList');

    cont.innerHTML='<div class="hist-empty">Sin operaciones guardadas.</div>';
    return;
  }
  cont.innerHTML=hist.map((h,i)=>`
    <div class="hist-item" data-i="${i}">
      <div class="hist-expr">${h.expr} =</div>
      <div class="hist-res">${h.res}</div>
    </div>
  `).join('');
  cont.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick=()=>{
      const item=hist[parseInt(el.dataset.i,10)];
      if(item){
        // Limpiar formato: puntos de miles fuera, coma por punto
        let val=item.res.replace(/\./g,'').replace(',','.');

        fresh=true;
        justEq=true;
        cerrarHist();

}

function init(){

  construirTeclado();

  window.addEventListener('resize',()=>{
    if(currentTab==='graf')setTimeout(dibujarGrafica,80);
  });
}

/* ============ DETALLES ============ */
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.detail-card{background:var(--sf);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--sh);border:1px solid var(--bd);}
.detail-icon{font-size:22px;margin-bottom:6px;line-height:1;}
.detail-label{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.detail-value{font-size:16px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}

/* ============ PRONÓSTICO ============ */
.fc-title{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;padding-left:4px;}
.fc-row{background:var(--sf);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);border:1px solid var(--bd);}
.fc-day{font-size:13px;font-weight:700;min-width:62px;color:var(--tx);text-transform:capitalize;}
.fc-icon{font-size:24px;flex-shrink:0;line-height:1;}
.fc-cond{flex:1;font-size:12.5px;color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fc-temp{font-size:14px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
.fc-temp .lo{color:var(--tx3);font-weight:400;margin-left:3px;}
.fc-rain{font-size:11px;color:var(--ac);flex-shrink:0;min-width:40px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}

/* ============ ESTADOS ============ */
.loading{text-align:center;padding:70px 20px;}
.loading-icon{font-size:52px;margin-bottom:16px;animation:spin 1.5s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--tx2);}
.error{text-align:center;padding:60px 20px;}
.error-icon{font-size:52px;margin-bottom:14px;}
.error-text{font-size:14px;color:var(--tx2);line-height:1.55;max-width:280px;margin:0 auto 20px;}
.retry-btn{padding:13px 28px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1200;font-size:14.5px;font-weight:700;box-shadow:0 6px 20px rgba(232,133,10,.3);}
.retry-btn:active{transform:scale(.97);}

footer{padding:8px 16px 14px;text-align:center;font-size:10px;color:var(--tx3);flex-shrink:0;font-style:italic;}
</style>
</head>
<body>

<\script>
'use strict';
var TK='clima_theme_v1';
function $(i){return document.getElementById(i);}
var WMO={
0:['☀️','Cielo despejado'],1:['🌤️','Mayormente despejado'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],
45:['🌫️','Niebla'],48:['🌫️','Niebla con escarcha'],
51:['🌦️','Llovizna ligera'],53:['🌦️','Llovizna moderada'],55:['🌧️','Llovizna densa'],
56:['🌧️','Llovizna helada'],57:['🌧️','Llovizna helada densa'],
61:['🌧️','Lluvia ligera'],63:['🌧️','Lluvia moderada'],65:['🌧️','Lluvia fuerte'],
66:['🌧️','Lluvia helada'],67:['🌧️','Lluvia helada fuerte'],
71:['🌨️','Nieve ligera'],73:['🌨️','Nieve moderada'],75:['🌨️','Nieve fuerte'],77:['🌨️','Granos de nieve'],
80:['🌦️','Chubascos ligeros'],81:['🌧️','Chubascos moderados'],82:['⛈️','Chubascos violentos'],
85:['🌨️','Chubascos de nieve'],86:['🌨️','Chubascos de nieve fuertes'],
95:['⛈️','Tormenta'],96:['⛈️','Tormenta con granizo'],99:['⛈️','Tormenta con granizo fuerte']
};
function wmo(c){return WMO[c]||['🌡️','Desconocido'];}
function th(t){
document.documentElement.setAttribute('data-theme',t);
$('tb').textContent=t==='dark'?'☀️':'🌙';
var m=document.querySelector('meta[name="theme-color"]');
if(m)m.setAttribute('content',t==='dark'?'#050B24':'#f5f7fb');
try{localStorage.setItem(TK,t);}catch(e){}
}
function dias(n){
var d=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
return d[n%7];
}
function load(){
var partes=$('city').value.split(',');
var lat=partes[0],lon=partes[1];
$('content').innerHTML='<div class="loading"><div class="loading-icon">🌍</div><div class="loading-text">Cargando clima...</div></div>';
var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5';
fetch(url)
.then(function(r){
if(!r.ok)throw new Error('HTTP '+r.status);
return r.json();
})
.then(function(d){
var c=d.current;
var ci=wmo(c.weather_code);
var sel=$('city');
var cityName=sel.options[sel.selectedIndex].text;
var html='';
html+='<div class="hero">';
html+='<div class="hero-icon">'+ci[0]+'</div>';
html+='<div class="hero-temp">'+Math.round(c.temperature_2m)+'°</div>';
html+='<div class="hero-cond">'+ci[1]+'</div>';
html+='<div class="hero-loc">📍 '+cityName+'</div>';
html+='</div>';
html+='<div class="details">';
html+='<div class="detail-card"><div class="detail-icon">🌡️</div><div class="detail-label">Sensación</div><div class="detail-value">'+Math.round(c.apparent_temperature)+'°</div></div>';
html+='<div class="detail-card"><div class="detail-icon">💧</div><div class="detail-label">Humedad</div><div class="detail-value">'+c.relative_humidity_2m+'%</div></div>';
html+='<div class="detail-card"><div class="detail-icon">💨</div><div class="detail-label">Viento</div><div class="detail-value">'+Math.round(c.wind_speed_10m)+' km/h</div></div>';
html+='</div>';
html+='<div class="fc-title">Pronóstico 5 días</div>';
var dd=d.daily;
for(var i=0;i<dd.time.length;i++){
var dt=new Date(dd.time[i]+'T12:00:00');
var di=wmo(dd.weather_code[i]);
html+='<div class="fc-row">';
html+='<div class="fc-day">'+(i===0?'Hoy':dias(dt.getDay()))+'</div>';
html+='<div class="fc-icon">'+di[0]+'</div>';
html+='<div class="fc-cond">'+di[1]+'</div>';
html+='<div class="fc-temp">'+Math.round(dd.temperature_2m_max[i])+'°<span class="lo">'+Math.round(dd.temperature_2m_min[i])+'°</span></div>';
html+='<div class="fc-rain">💧'+dd.precipitation_probability_max[i]+'%</div>';
html+='</div>';
}
$('content').innerHTML=html;
})
.catch(function(e){
$('content').innerHTML='<div class="error"><div class="error-icon">⚠️</div><div class="error-text">No se pudo cargar el clima.<br>Verifica tu conexión a internet.</div><button class="retry-btn" id="rty">Reintentar</button></div>';
var rty=$('rty');
if(rty)rty.onclick=load;
});
}
function init(){
$('year').textContent=new Date().getFullYear();
th(localStorage.getItem(TK)||'dark');
$('tb').onclick=function(){
var c=document.documentElement.getAttribute('data-theme')||'dark';
th(c==='dark'?'light':'dark');
};
$('rb').onclick=load;
$('city').onchange=load;
load();
}
document.addEventListener('DOMContentLoaded',init);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="b_contemplacion">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a20">
<title>Contemplación</title>
<style>
:root{
--bg:#f5f2ff;--bg2:#ebe5fa;--sf:#fff;--tx:#181230;--tx2:#5a4a80;--tx3:#a090c0;
--bd:#ddd2ee;--ac:#6366f1;--ac2:#818cf8;--acs:rgba(99,102,241,.12);
--gold:#c9a227;--gold2:#e8c547;--dg:#c0392b;--ok:#0a7a3a;
--sh:0 2px 10px rgba(60,30,100,.08);
}
[data-theme=dark]{
--bg:#0a0a20;--bg2:#151236;--sf:#1a1545;--tx:#f0eaff;--tx2:#a89cd0;--tx3:#6a5f8c;
--bd:#2a2258;--ac:#a78bfa;--ac2:#c4b5fd;--acs:rgba(167,139,250,.15);
--gold:#e8c547;--gold2:#ffd96b;--dg:#f87171;--ok:#34d399;
--sh:0 4px 22px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;max-width:100%;}
html,body{position:fixed;inset:0;overflow:hidden;width:100%;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;max-width:100%;}
textarea{font-family:inherit;max-width:100%;outline:none;}

#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;width:100vw;background:var(--bg);}

.aviso-error{position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:12px 16px;font-size:12px;z-index:9999;display:none;line-height:1.5;word-break:break-word;}
.aviso-error.op{display:block;}

/* Cabecera */
.hd{padding:18px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0;}
.hd-left{flex:1 1 auto;min-width:0;}
.tt{font-family:Georgia,serif;font-style:italic;font-size:clamp(24px,7.5vw,32px);font-weight:600;letter-spacing:-.5px;color:var(--ac2);line-height:1.05;}
.st{font-size:11.5px;color:var(--tx2);margin-top:4px;font-style:italic;}
.hr{display:flex;gap:6px;flex-shrink:0;}
.ib{width:42px;height:42px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.ib:active{opacity:.8;}

/* Contenido */
.ct{flex:1 1 0;overflow-y:auto;overflow-x:hidden;padding:6px 16px 40px;min-height:0;}
.ct::-webkit-scrollbar{display:none;}

/* Tarjeta de frase */
.frase-card{
background:var(--sf);border-radius:20px;
padding:26px 22px;border:1px solid var(--bd);
margin-bottom:16px;position:relative;overflow:hidden;
}
.frase-card::before{
content:'';position:absolute;top:0;left:20px;right:20px;height:3px;
background:var(--ac);border-radius:0 0 3px 3px;
}
.frase-num{font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
.frase-texto{
font-family:Georgia,serif;font-style:italic;
font-size:clamp(19px,5.5vw,23px);font-weight:500;
color:var(--tx);line-height:1.5;letter-spacing:-.2px;
margin-bottom:14px;
}
.frase-autor{font-size:13.5px;font-weight:700;color:var(--ac);text-align:right;letter-spacing:.3px;}
.frase-obra{font-size:11.5px;color:var(--tx3);text-align:right;font-style:italic;margin-top:2px;}

.frase-acciones{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);}
.frase-acciones button{flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;letter-spacing:.2px;}
.fr-otra{background:var(--acs);color:var(--ac);}
.fr-copiar{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);}

/* Preguntas */
.preg-card{
background:var(--sf);border-radius:18px;
padding:18px 20px;border:1px solid var(--bd);
margin-bottom:16px;
}
.preg-tit{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.preg-tit .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.preg-lista{list-style:none;padding:0;}
.preg-lista li{
font-size:14.5px;line-height:1.6;color:var(--tx);
padding:8px 0 8px 22px;position:relative;
border-bottom:1px solid var(--bd);
}
.preg-lista li:last-child{border-bottom:none;padding-bottom:0;}
.preg-lista li:first-child{padding-top:0;}
.preg-lista li::before{content:'✦';position:absolute;left:0;top:8px;font-size:10px;color:var(--ac);}
.preg-lista li:first-child::before{top:0;}

/* Escribir */
.escribir-card{
background:var(--sf);border-radius:18px;
padding:16px;border:1px solid var(--bd);
margin-bottom:16px;
}
.esc-tit{font-size:11px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.esc-tit .contador{color:var(--tx3);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px;font-style:italic;}
.esc-texto{
width:100%;padding:14px;border-radius:12px;
background:var(--bg);border:1.5px solid var(--bd);
color:var(--tx);font-size:15.5px;line-height:1.75;
resize:vertical;min-height:140px;max-height:400px;
}
.esc-texto:focus{border-color:var(--ac);}
.esc-texto::placeholder{color:var(--tx3);font-style:italic;}
.esc-btn{
display:block;width:100%;padding:14px;border-radius:12px;
background:var(--ac);color:#fff;font-size:15px;font-weight:700;
margin-top:12px;letter-spacing:.3px;
}
.esc-btn:active{opacity:.85;}

/* Historial */
.hist-tit{font-size:11.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;margin:22px 4px 12px;display:flex;justify-content:space-between;align-items:center;}
.hist-tit:first-of-type{margin-top:4px;}
.hist-tit .cuenta{font-size:11px;color:var(--tx3);font-weight:500;letter-spacing:0;text-transform:none;}

.ref-item{
background:var(--sf);border-radius:14px;
padding:14px 16px;border:1px solid var(--bd);
margin-bottom:10px;cursor:pointer;
position:relative;overflow:hidden;
}
.ref-item:active{opacity:.85;}
.ref-item::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--ac);}
.ref-fecha{font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.ref-frase{font-family:Georgia,serif;font-style:italic;font-size:13.5px;color:var(--tx2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ref-prev{font-size:13px;color:var(--tx);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}

.vacio{
text-align:center;padding:40px 24px;
color:var(--tx3);font-size:14px;line-height:1.7;
font-style:italic;
}

/* Ver todas */
.btn-ver-todas{
display:block;width:100%;padding:14px;border-radius:12px;
background:var(--sf);border:1px solid var(--bd);
color:var(--ac);font-size:14px;font-weight:700;
letter-spacing:.3px;margin-top:8px;
}
.btn-ver-todas:active{opacity:.85;}

/* Modal */
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;}
.md.op{display:flex;}
.sheet{background:var(--sf);width:100%;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sheet-hd h2{font-size:19px;font-weight:700;color:var(--tx);font-family:Georgia,serif;font-style:italic;}
.sheet-x{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

/* Detalle reflexión */
.detalle-vista{display:none;flex-direction:column;position:fixed;inset:0;background:var(--bg);z-index:60;overflow:hidden;}
.detalle-vista.op{display:flex;}
.det-hd{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid var(--bd);}
.det-hd .ib{width:40px;height:40px;font-size:18px;}
.det-titulo-wrap{flex:1 1 auto;min-width:0;}
.det-titulo{font-family:Georgia,serif;font-style:italic;font-size:16px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.det-sub{font-size:10.5px;color:var(--tx2);margin-top:2px;font-style:italic;}
.det-body{flex:1 1 0;overflow-y:auto;padding:18px 16px 30px;min-height:0;}
.det-frase{
background:var(--bg2);border-radius:14px;padding:16px 18px;
margin-bottom:16px;border-left:3px solid var(--ac);
}
.det-frase-txt{font-family:Georgia,serif;font-style:italic;font-size:15.5px;line-height:1.55;color:var(--tx);margin-bottom:8px;}
.det-frase-autor{font-size:12px;font-weight:700;color:var(--ac);text-align:right;}
.det-reflex{
background:var(--sf);border-radius:14px;padding:18px 20px;
border:1px solid var(--bd);
font-size:15.5px;line-height:1.75;color:var(--tx);

.det-borrar{background:var(--bg2);color:var(--dg);border:1px solid var(--bd);}
.det-cerrar{background:var(--ac);color:#fff;}

/* Toast */
.ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:300;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.ts.sh{opacity:1;transform:translateX(-50%) translateY(0);}

footer{padding:8px 16px 14px;text-align:center;font-size:10px;color:var(--tx3);flex-shrink:0;font-style:italic;}
</style>
</head>
